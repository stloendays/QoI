name: Audit QSQ research validity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_qsq_research.py
      - .github/workflows/audit_qsq_research.yml
permissions:
  contents: write
concurrency:
  group: qsq-research-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned analysis dependencies
        run: python -m pip install numpy==2.1.3 pandas==2.2.3
      - name: Unit-test boundary and missingness semantics
        run: python scripts/audit_qsq_research.py --self-test
      - name: Audit frozen data
        run: python scripts/audit_qsq_research.py
      - name: Verify frozen inputs were not modified
        run: git diff --exit-code -- benchmark stability protocol
      - name: Retain complete audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: qsq-research-audit
          path: analysis/research_upgrade/
          if-no-files-found: error
      - name: Commit additive audit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/research_upgrade/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: record common-ladder and held-out-seed diagnostics'
          git pull --rebase origin main
          git push origin HEAD:main
