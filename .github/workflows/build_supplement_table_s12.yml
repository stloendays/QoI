name: Build Supplementary Table S12

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_supplement_table_s12_20260911.py'
      - '.github/workflows/build_supplement_table_s12.yml'
      - 'analysis/matched_realized_linf_v1/matching_diagnostics.csv'
      - 'analysis/matched_realized_linf_v1/matched_effects_summary.csv'

permissions:
  contents: write

concurrency:
  group: qoi-submission-table-writeback
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build S12
        run: python scripts/build_supplement_table_s12_20260911.py
      - name: Validate
        run: |
          test -s paper/SUPPLEMENTARY_TABLE_S12_20260911.md
          test -s supplement/S12_matching_sensitivity.csv
          git diff --check -- paper/SUPPLEMENTARY_TABLE_S12_20260911.md scripts/build_supplement_table_s12_20260911.py
      - name: Commit generated outputs
        run: |
          paths=(paper/SUPPLEMENTARY_TABLE_S12_20260911.md supplement/S12_matching_sensitivity.csv)
          if [ -z "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo 'No changes to commit.'
            exit 0
          fi
          tmp=$(mktemp -d)
          cp paper/SUPPLEMENTARY_TABLE_S12_20260911.md supplement/S12_matching_sensitivity.csv "$tmp"/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          cp "$tmp/SUPPLEMENTARY_TABLE_S12_20260911.md" paper/
          cp "$tmp/S12_matching_sensitivity.csv" supplement/
          git add "${paths[@]}"
          git commit -m 'supplement: build Table S12 matching sensitivity'
          git push origin HEAD:main
