name: External E2E Frozen Pilot

on:
  workflow_dispatch:
  push:
    branches: [external-e2e-validation]
    paths:
      - '.github/workflows/external-e2e-pilot.yml'
      - 'validation/external_end_to_end.py'
      - 'validation/formal_external_e2e.py'
      - 'validation/aggregate_formal_external.py'
      - 'validation/preflight_formal_external.py'
      - 'external_test_MANIFEST.json'
      - 'stability/stability_floor_A1.csv'
      - 'protocol/PROTOCOL_A1.md'
      - 'benchmark/master_benchmark_full.csv'
      - 'benchmark/master_benchmark_tight_ladder.csv'

concurrency:
  group: external-e2e-frozen-pilot
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify frozen external benchmark invariants
        run: python validation/preflight_formal_external.py

      - name: Install frozen scientific stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy \
            baderkit==0.10.2 \
            pysz==1.0.3 \
            zfpy==1.0.1 \
            hdf5plugin==7.0.0 \
            h5py

      - name: Run frozen staged pilot on one AFLOW bulk and one NOMAD 2D system
        run: |
          python validation/formal_external_e2e.py \
            --material-id aflow-Ni1_ICSD_181716 \
            --material-id nomad2d-0XHkHlmw3DQ_ \
            --codecs zfp,sz3,sperr \
            --output-dir validation/pilot

      - name: Aggregate pilot and compute material-level CCR statistics
        if: always()
        run: |
          python validation/aggregate_formal_external.py \
            --input-root validation/pilot \
            --output-dir validation/pilot_aggregate

      - name: Upload pilot outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-e2e-frozen-pilot
          path: |
            validation/pilot
            validation/pilot_aggregate
          if-no-files-found: error
