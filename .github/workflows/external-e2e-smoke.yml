name: External E2E Smoke

on:
  workflow_dispatch:
  push:
    branches: [external-e2e-validation]
    paths:
      - 'validation/external_end_to_end.py'
      - 'validation/preflight_formal_external.py'
      - '.github/workflows/external-e2e-smoke.yml'
      - 'external_test_MANIFEST.json'
      - 'stability/stability_floor_A1.csv'
      - 'protocol/PROTOCOL_A1.md'
      - 'benchmark/master_benchmark_full.csv'
      - 'benchmark/master_benchmark_tight_ladder.csv'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify frozen external benchmark invariants
        run: python validation/preflight_formal_external.py

      - name: Install frozen scientific stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy \
            baderkit==0.10.2 \
            pysz==1.0.3 \
            zfpy==1.0.1 \
            hdf5plugin==7.0.0 \
            h5py

      - name: Run NOMAD protocol smoke
        run: |
          python validation/external_end_to_end.py \
            --material-id nomad2d-0XHkHlmw3DQ_ \
            --codecs zfp,sz3,sperr \
            --relative-tolerances 1e-5 \
            --output-dir validation/results/nomad

      - name: Run AFLOW single-species provenance smoke
        if: success()
        run: |
          python validation/external_end_to_end.py \
            --material-id aflow-Ni1_ICSD_181716 \
            --codecs zfp \
            --relative-tolerances 1e-5 \
            --output-dir validation/results/aflow_single

      - name: Run AFLOW multi-species provenance smoke
        if: success()
        run: |
          python validation/external_end_to_end.py \
            --material-id aflow-Al1C1Ta2_ICSD_606258 \
            --codecs zfp \
            --relative-tolerances 1e-5 \
            --output-dir validation/results/aflow_multi

      - name: Upload validation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-e2e-smoke
          path: validation/results
          if-no-files-found: error
