name: External E2E Smoke

on:
  workflow_dispatch:
  push:
    branches: [external-e2e-validation]
    paths:
      - 'validation/external_end_to_end.py'
      - '.github/workflows/external-e2e-smoke.yml'
      - 'external_test_MANIFEST.json'
      - 'stability/stability_floor_A1.csv'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install frozen scientific stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy \
            baderkit==0.10.2 \
            pysz==1.0.3 \
            zfpy==1.0.1 \
            hdf5plugin==7.0.0 \
            h5py

      - name: Run external Ni end-to-end smoke
        run: |
          python validation/external_end_to_end.py \
            --material-id aflow-Ni1_ICSD_181716 \
            --codecs zfp,sz3,sperr \
            --relative-tolerances 1e-5 \
            --output-dir validation/results

      - name: Upload validation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-e2e-smoke
          path: validation/results
          if-no-files-found: error
