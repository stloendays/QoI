name: QOAC-B3 real engineering

# Runs only on manual dispatch or when the study owner pushes the sentinel
# file analysis/qoac_b3_design/RUN_REAL to the research branch.
on:
  workflow_dispatch:
  push:
    branches:
      - research/qoac-b3-design-20261006
    paths:
      - analysis/qoac_b3_design/RUN_REAL

permissions:
  contents: write

concurrency:
  group: qoac-b3-real-engineering-20261006
  cancel-in-progress: false

env:
  MANIFEST: analysis/fresh_population_20261006/P2_ENGINEERING_MANIFEST.csv
  FROZEN_COMMIT: 893f931b3045b0b628329db81999c2f439d4e830
  RESULTS: analysis/qoac_b3_design/results/real_engineering

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      indices: ${{ steps.idx.outputs.indices }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - id: idx
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.4.6
          python -m py_compile repo/analysis/qoac_b3_design/*.py
          (cd repo/analysis/qoac_b3_design && python -m unittest -q test_qoac_b3.py test_run_real_engineering.py)
          n=$(python -c "import csv; print(len(list(csv.DictReader(open('repo/$MANIFEST')))))")
          test "$n" -gt 0
          echo "indices=$(python -c "import json; print(json.dumps(list(range($n))))")" >> "$GITHUB_OUTPUT"

  material:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        index: ${{ fromJSON(needs.preflight.outputs.indices) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_COMMIT }}
          path: frozen
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: frozen/validation/requirements-external-e2e.txt
      - name: Install scientific stack and Fortran compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran
          python -m pip install --upgrade pip
          python -m pip install -r frozen/validation/requirements-external-e2e.txt
      - name: Build Henkelman Bader
        shell: bash
        run: |
          set -euo pipefail
          cp -r repo/mechanism/independent_bader_20260908/reference_source "$RUNNER_TEMP/bader_source"
          cd "$RUNNER_TEMP/bader_source"
          sed -i 's/^LINK = -static/LINK =/' makefile.osx_gfortran
          make -f makefile.osx_gfortran
          test -x bader
      - name: Run material
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/qoac_b3_${{ matrix.index }}"
          python repo/analysis/qoac_b3_design/run_real_engineering.py run \
            --repo-root repo --frozen-root frozen \
            --manifest "repo/$MANIFEST" --index ${{ matrix.index }} \
            --bader "$RUNNER_TEMP/bader_source/bader" --output-dir "$out"
          git -C repo rev-parse HEAD > "$out/research_branch_commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qoac-b3-material-${{ matrix.index }}
          path: ${{ runner.temp }}/qoac_b3_${{ matrix.index }}
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    if: always() && needs.preflight.result == 'success'
    needs: [preflight, material]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install numpy==2.3.5 pandas==2.3.3
      - uses: actions/download-artifact@v4
        with:
          pattern: qoac-b3-material-*
          path: materials
      - name: Aggregate
        shell: bash
        run: |
          set -euo pipefail
          out="repo/$RESULTS"
          rm -rf "$out"
          mkdir -p "$out/materials" materials
          python repo/analysis/qoac_b3_design/run_real_engineering.py aggregate \
            --manifest "repo/$MANIFEST" --inputs-root materials --output-dir "$out"
          find materials -name '*.json' -o -name '*_rows.csv' | while read -r f; do cp "$f" "$out/materials/"; done
          git -C repo rev-parse HEAD > "$out/research_branch_commit_before_results.txt"
          echo "$FROZEN_COMMIT" > "$out/frozen_scientific_commit.txt"
      - name: Commit results
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULTS"
          if git diff --cached --quiet; then echo 'No result changes.'; else
            git commit -m "research: QOAC-B3 real engineering results"
            git pull --rebase origin research/qoac-b3-design-20261006
            git push origin HEAD:research/qoac-b3-design-20261006
          fi
