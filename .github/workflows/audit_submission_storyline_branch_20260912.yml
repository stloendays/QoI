name: Audit submission storyline branch

on:
  push:
    branches:
      - paper/submission-storyline-20260912
    paths:
      - '.github/workflows/audit_submission_storyline_branch_20260912.yml'
      - 'paper/SUBMISSION_STORYLINE_AUDIT_START_20260912'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: paper/submission-storyline-20260912
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Run frozen P1-P4 cross-reference audit
        run: |
          python -m py_compile scripts/audit_submission_upgrade_consistency.py
          python scripts/audit_submission_upgrade_consistency.py
      - name: Verify current storyline and evidence hierarchy
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Status: \*\*PASS\*\*' paper/SUBMISSION_UPGRADE_CROSS_REFERENCE_AUDIT_20260911.md
          grep -q 'P1 equal-search | PASS' paper/SUBMISSION_UPGRADE_CROSS_REFERENCE_AUDIT_20260911.md
          grep -q 'P2 prospective | PASS' paper/SUBMISSION_UPGRADE_CROSS_REFERENCE_AUDIT_20260911.md
          grep -q 'P3A implementation transfer | PASS' paper/SUBMISSION_UPGRADE_CROSS_REFERENCE_AUDIT_20260911.md
          grep -q 'P4 chemistry boundary | PASS' paper/SUBMISSION_UPGRADE_CROSS_REFERENCE_AUDIT_20260911.md
          grep -q '20.34-fold' paper/MANUSCRIPT_TOP_JOURNAL_POLISHED_20260911.md
          grep -q '50.83-fold' paper/MANUSCRIPT_TOP_JOURNAL_POLISHED_20260911.md
          grep -q '14,986/14,986' paper/MANUSCRIPT_TOP_JOURNAL_POLISHED_20260911.md
          grep -q 'Figure 3 combines these two controls' paper/MANUSCRIPT_TOP_JOURNAL_POLISHED_20260911.md
          grep -q 'The primary Figure 3 claim is prospective risk stratification after a separate equal-search control.' paper/FIGURE3_CAPTION_FINAL_20260911.md
          grep -q 'P1 equal-search control' paper/FIGURE_MAP.md
          ! grep -q 'more than 95% of apparent binary failures cannot be scientifically attributed to the compressor' paper/MANUSCRIPT_TOP_JOURNAL_POLISHED_20260911.md
      - name: Commit refreshed audit record if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/SUBMISSION_UPGRADE_CROSS_REFERENCE_AUDIT_20260911.md
          if git diff --cached --quiet; then
            echo 'Audit record already consistent.'
          else
            git commit -m 'paper: pass storyline cross-reference audit'
            git pull --rebase origin paper/submission-storyline-20260912
            git push origin HEAD:paper/submission-storyline-20260912
          fi
