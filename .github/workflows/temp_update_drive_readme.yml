name: Temporary update Drive data map in README

on:
  push:
    branches: [docs/drive-data-map-20260916]
    paths:
      - .github/workflows/temp_update_drive_readme.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/drive-data-map-20260916
          fetch-depth: 2
      - name: Insert storage and agent data map
        run: python -c "from pathlib import Path; p=Path('README.md'); t=p.read_text(); m='## Data storage and Agent map'; s='## Data storage and Agent map\\n\\nLarge codec benchmark payloads are mirrored to the frozen Google Drive dataset [RhoCodec_QSQ_Data/frozen_codec_benchmark_20260916](https://drive.google.com/drive/folders/1X62ZTw5kYJVbLhImz7zz0VvMIfPjIBVg). The machine-readable cross-store map is `data/DRIVE_DATA_MANIFEST.json`.\\n\\n**Authority split.** Google Drive is the long-term bulk-data archive for the migrated codec tables. GitHub `main` remains authoritative for code, schema semantics, QSQ/certification rules, manifests, and frozen scientific claims. GitHub copies of benchmark files are intentionally retained where CI, reproducibility, or the deterministic recommendation layer reads them directly; this migration is not a scientific redefinition.\\n\\n**Agent rule.** Before using migrated codec data, read `data/DRIVE_DATA_MANIFEST.json`, verify the recorded source commit and SHA-256, and stop on a Drive/GitHub provenance mismatch. Reader-facing terminology is **QoI Stability Qualification (QSQ)**; `A`, `A1`, and `_A1` names remain historical provenance or frozen-schema identifiers only. Storage location must never change P1-P4, thresholds, cohorts, endpoints, eligibility, certification semantics, or the rule that recommendations rank only measured QSQ-eligible certified operating points.\\n\\n'; a='## Central question\\n'; p.write_text(t if m in t else t.replace(a,s+a,1))"
      - name: Remove temporary workflow
        run: rm .github/workflows/temp_update_drive_readme.yml
      - name: Commit documentation-only update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/temp_update_drive_readme.yml
          git commit -m 'docs: explain Drive benchmark storage for agents'
          git push origin HEAD:docs/drive-data-map-20260916
