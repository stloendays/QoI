name: Hartree-potential QoI pilot

# Manual only. The scientific outputs committed under analysis/hartree_potential_pilot/
# were generated locally with the frozen benchmark's interpreter (see provenance.json);
# this workflow re-runs the same script with the same loader for verification.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy==2.3.5 pandas==2.3.3 zfpy==1.0.1
      - name: Download and SHA-verify the 12 pilot source densities
        run: |
          python - <<'PY'
          import hashlib, os, urllib.request, pandas as pd, numpy as np
          bench=pd.read_csv('benchmark/master_benchmark_full.csv', low_memory=False)
          meta=pd.read_csv('materials_metadata.csv').set_index('material_id')
          z=bench[(bench.codec=='ZFP')&(bench.system_type=='bulk')]
          z=z[np.isfinite(z.nominal_tolerance_absolute)&np.isfinite(z.Bader_error_resolved_e)]
          counts=z.groupby('material_id').size(); order=z.groupby('material_id').npoints.first().sort_values().index
          mids=[m for m in order if counts[m]>=5][:12]
          os.makedirs('.cache/hartree_pilot', exist_ok=True)
          for mid in mids:
              fn=f'.cache/hartree_pilot/{mid}.json.gz'
              urllib.request.urlretrieve(str(meta.loc[mid,'url']), fn)
              h=hashlib.sha256(open(fn,'rb').read()).hexdigest()
              assert h==str(meta.loc[mid,'sha256']), (mid, h)
              print(mid, 'ok')
          PY
      - name: Run pilot (writes analysis/hartree_potential_pilot/*)
        run: python analysis/hartree_potential_pilot/run_hartree_pilot.py --cache .cache/hartree_pilot
      - name: Show diff against committed outputs
        run: git status --short analysis/hartree_potential_pilot && git diff --stat analysis/hartree_potential_pilot
      - uses: actions/upload-artifact@v4
        with:
          name: hartree-potential-pilot-rerun
          path: analysis/hartree_potential_pilot
