name: Hartree-potential QoI pilot

on:
  push:
    paths:
      - '.github/workflows/hartree_potential_pilot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy==1.26.4 scipy pandas pymatgen monty zfpy==1.0.1
      - name: Run ZFP Hartree-potential pilot
        run: |
          python - <<'PY'
          import os, math, gzip, json, hashlib, urllib.request
          import numpy as np
          import pandas as pd
          import zfpy
          from monty.serialization import loadfn

          outdir='analysis/hartree_potential_pilot'
          cachedir='.cache/hartree_pilot'
          os.makedirs(outdir, exist_ok=True); os.makedirs(cachedir, exist_ok=True)

          bench=pd.read_csv('benchmark/master_benchmark_full.csv')
          meta=pd.read_csv('materials_metadata.csv')
          z=bench[(bench.codec=='ZFP') & (bench.system_type=='bulk')].copy()
          z=z[np.isfinite(z['nominal_tolerance_absolute']) & np.isfinite(z['Bader_error_resolved_e'])]

          # Prefer small bulk grids so the pilot is reproducible and inexpensive.
          counts=(z[['material_id','npoints']].drop_duplicates().sort_values('npoints'))
          mids=[]
          for mid in counts.material_id:
              g=z[z.material_id==mid]
              if len(g)>=5:
                  mids.append(mid)
              if len(mids)>=12: break

          # For each material choose three rows spanning tight/intermediate/loose realized perturbation.
          selected=[]
          for mid in mids:
              g=z[z.material_id==mid].sort_values('realized_Linf')
              idx=sorted(set([0, len(g)//2, len(g)-1]))
              selected.append(g.iloc[idx])
          sel=pd.concat(selected,ignore_index=True)
          mm=meta.set_index('material_id')

          def download(mid):
              row=mm.loc[mid]
              url=str(row.url); expected=str(row.sha256)
              fn=os.path.join(cachedir,mid+'.json.gz')
              if not os.path.exists(fn):
                  urllib.request.urlretrieve(url,fn)
              h=hashlib.sha256(open(fn,'rb').read()).hexdigest()
              if h!=expected:
                  raise RuntimeError(f'SHA mismatch {mid}: {h} != {expected}')
              return fn

          def load_density(path):
              obj=loadfn(path)
              # Materials Project parsed charge-density JSON is Monty-decoded to ChargeDensity/Chgcar-like object.
              data=np.asarray(obj.data['total'],dtype=np.float64)
              lattice=np.asarray(obj.structure.lattice.matrix,dtype=np.float64)
              return data,lattice

          def poisson_potential(field,lattice):
              # Periodic electronic Hartree potential with G=0 fixed to zero (gauge).
              # Absolute density scale cancels in the normalized potential-error metrics below.
              nx,ny,nz=field.shape
              rec=2*np.pi*np.linalg.inv(lattice).T  # reciprocal basis vectors, 1/Angstrom
              ix=np.fft.fftfreq(nx)*nx; iy=np.fft.fftfreq(ny)*ny; iz=np.fft.fftfreq(nz)*nz
              F=np.fft.fftn(field)
              V=np.zeros_like(F,dtype=np.complex128)
              # Slice over x to limit peak memory from a full 3D G-vector tensor.
              for a,kx in enumerate(ix):
                  gy, gz=np.meshgrid(iy,iz,indexing='ij')
                  Gx=kx*rec[:,0][None,None,:] if False else None
                  # Cartesian G components from integer reciprocal coordinates.
                  G0=kx*rec[:,0]
                  Gcart=(G0[:,None,None] + rec[:,1,None,None]*gy[None,:,:] + rec[:,2,None,None]*gz[None,:,:])
                  g2=np.sum(Gcart*Gcart,axis=0)
                  mask=g2>0
                  V[a][mask]=4*np.pi*F[a][mask]/g2[mask]
              return np.fft.ifftn(V).real

          records=[]
          pot_cache={}
          for mid in mids:
              path=download(mid)
              rho,lattice=load_density(path)
              vorig=poisson_potential(rho,lattice)
              vrms=float(np.sqrt(np.mean(vorig**2)))
              vscale=max(vrms,1e-30)
              sub=sel[sel.material_id==mid].sort_values('realized_Linf')
              for _,r in sub.iterrows():
                  tol=float(r.nominal_tolerance_absolute)
                  blob=zfpy.compress_numpy(rho,tolerance=tol)
                  recon=zfpy.decompress_numpy(blob)
                  linf=float(np.max(np.abs(recon-rho)))
                  dv=poisson_potential(recon-rho,lattice)
                  drm=float(np.sqrt(np.mean(dv**2)))
                  dmx=float(np.max(np.abs(dv)))
                  records.append({
                      'material_id':mid,
                      'formula':r.formula,
                      'npoints':int(r.npoints),
                      'nominal_tolerance_relative':float(r.nominal_tolerance_relative),
                      'nominal_tolerance_absolute':tol,
                      'master_realized_Linf':float(r.realized_Linf),
                      'reproduced_realized_Linf':linf,
                      'Linf_reproduction_ratio':linf/max(float(r.realized_Linf),1e-30),
                      'compression_ratio_master':float(r.compression_ratio),
                      'Bader_error_resolved_e':float(r.Bader_error_resolved_e),
                      'potential_rel_RMSE':drm/vscale,
                      'potential_rel_Linf':dmx/vscale,
                  })
                  print(mid, 'tol',tol,'Linf ratio',records[-1]['Linf_reproduction_ratio'],'Vrel',records[-1]['potential_rel_RMSE'],'Bader',records[-1]['Bader_error_resolved_e'])

          df=pd.DataFrame(records)
          df.to_csv(outdir+'/pilot_rows.csv',index=False)

          # Only interpret rows whose reconstructed Linf agrees with the frozen benchmark to within 5%.
          valid=df[(df.Linf_reproduction_ratio>=0.95)&(df.Linf_reproduction_ratio<=1.05)].copy()
          def pearson_log(a,b):
              a=np.asarray(a,float); b=np.asarray(b,float)
              mask=np.isfinite(a)&np.isfinite(b)&(a>0)&(b>0)
              if mask.sum()<3:return float('nan')
              return float(np.corrcoef(np.log10(a[mask]),np.log10(b[mask]))[0,1])

          summary={
              'n_materials_attempted':len(mids),
              'n_rows':len(df),
              'n_reproduction_valid':len(valid),
              'median_Linf_reproduction_ratio':float(df.Linf_reproduction_ratio.median()),
              'median_potential_rel_RMSE':float(valid.potential_rel_RMSE.median()) if len(valid) else float('nan'),
              'p95_potential_rel_RMSE':float(valid.potential_rel_RMSE.quantile(.95)) if len(valid) else float('nan'),
              'median_Bader_error_e':float(valid.Bader_error_resolved_e.median()) if len(valid) else float('nan'),
              'corr_log_Verr_vs_log_Linf':pearson_log(valid.potential_rel_RMSE,valid.reproduced_realized_Linf) if len(valid) else float('nan'),
              'corr_log_Bader_vs_log_Linf':pearson_log(valid.Bader_error_resolved_e,valid.reproduced_realized_Linf) if len(valid) else float('nan'),
              'corr_log_Verr_vs_log_Bader':pearson_log(valid.potential_rel_RMSE,valid.Bader_error_resolved_e) if len(valid) else float('nan'),
          }
          pd.DataFrame([summary]).to_csv(outdir+'/summary.csv',index=False)

          # A smooth QoI should be approximately monotone with perturbation within each material.
          mono=[]
          for mid,g in valid.groupby('material_id'):
              g=g.sort_values('reproduced_realized_Linf')
              v=np.asarray(g.potential_rel_RMSE)
              b=np.asarray(g.Bader_error_resolved_e)
              mono.append({'material_id':mid,'n':len(g),
                           'potential_monotone':bool(np.all(np.diff(v)>=-1e-15)),
                           'bader_monotone':bool(np.all(np.diff(b)>=-1e-15)),
                           'potential_dynamic_range':float(v.max()/max(v.min(),1e-30)),
                           'bader_dynamic_range':float(b.max()/max(b.min(),1e-30))})
          md=pd.DataFrame(mono)
          md.to_csv(outdir+'/monotonicity.csv',index=False)

          report=f'''# Hartree-potential QoI pilot (ZFP)\n\n## Design\nA 12-material bulk pilot re-generates ZFP reconstructions directly from the public source densities and compares the periodic electronic Hartree potential of the reconstruction against the original. The G=0 component is fixed to zero, so only physically meaningful spatial potential variation is compared.\n\nThe primary potential metric is normalized RMS error: `RMS(V_recon - V_orig) / RMS(V_orig)`. Bader errors are taken from the frozen master table for the exact same material/tolerance rows.\n\n## Reproduction gate\nRows are interpreted only when regenerated ZFP `realized_Linf` agrees with the frozen benchmark within 5%.\n\n- attempted materials: **{summary['n_materials_attempted']}**\n- attempted rows: **{summary['n_rows']}**\n- reproduction-valid rows: **{summary['n_reproduction_valid']}**\n- median regenerated/frozen Linf ratio: **{summary['median_Linf_reproduction_ratio']:.6g}**\n\n## Pilot results on reproduction-valid rows\n- median relative Hartree-potential RMSE: **{summary['median_potential_rel_RMSE']:.6g}**\n- 95th percentile relative Hartree-potential RMSE: **{summary['p95_potential_rel_RMSE']:.6g}**\n- median re-solved Bader error: **{summary['median_Bader_error_e']:.6g} e**\n- corr(log potential error, log realized Linf): **{summary['corr_log_Verr_vs_log_Linf']:.4f}**\n- corr(log Bader error, log realized Linf): **{summary['corr_log_Bader_vs_log_Linf']:.4f}**\n- corr(log potential error, log Bader error): **{summary['corr_log_Verr_vs_log_Bader']:.4f}**\n\n## Go/no-go rule\nExpand this QoI beyond the pilot only if (i) the reconstruction gate passes for most rows, and (ii) Hartree-potential error exhibits a reproducible, smooth relationship with realized perturbation that is materially different from the topology-sensitive Bader response. Otherwise this extension should not enter the manuscript.\n'''
          open(outdir+'/RESULTS.md','w').write(report)
          print(report)
          PY
      - name: Commit pilot outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/hartree_potential_pilot
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "analysis: Hartree-potential QoI pilot results"
          git push
