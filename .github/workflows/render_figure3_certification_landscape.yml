name: Render Figure 3 certification landscape

on:
  workflow_dispatch:
  push:
    paths:
      - 'figures/R/figure3_certification_landscape.R'
      - '.github/workflows/render_figure3_certification_landscape.yml'
      - 'benchmark/master_benchmark_full.csv'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ggplot2
            any::dplyr
            any::tidyr
            any::scales
            any::patchwork
            any::svglite
      - name: Render Figure 3
        run: Rscript figures/R/figure3_certification_landscape.R
      - uses: actions/upload-artifact@v4
        with:
          name: figure3-certification-landscape
          path: |
            figures/R/rendered/figure3_certification_landscape_R.png
            figures/R/rendered/figure3_certification_landscape_R.pdf
            figures/R/rendered/figure3_certification_landscape_R.svg
      - name: Commit rendered SVG
        shell: bash
        run: |
          if [ ! -f figures/R/rendered/figure3_certification_landscape_R.svg ]; then
            echo "SVG output not present; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/R/rendered/figure3_certification_landscape_R.svg
          if git diff --cached --quiet; then
            echo "SVG unchanged."
            exit 0
          fi
          git commit -m "figure: render Figure 3 SVG"
          git push
