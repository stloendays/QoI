name: Render Figure 3 certification landscape

on:
  workflow_dispatch:
  push:
    paths:
      - 'figures/R/figure3_certification_landscape.R'
      - '.github/workflows/render_figure3_certification_landscape.yml'
      - 'analysis/research_upgrade/p1_common_tight_summary.csv'
      - 'analysis/research_upgrade/p2_fresh_probe_cohort_summary.csv'

permissions:
  contents: write

concurrency:
  group: qoi-formal-figure-writeback
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ggplot2
            any::dplyr
            any::tidyr
            any::scales
            any::patchwork
            any::svglite
      - name: Render Figure 3
        run: Rscript figures/R/figure3_certification_landscape.R
      - name: Validate Figure 3 outputs
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            figures/R/rendered/figure3_certification_landscape_R.png \
            figures/R/rendered/figure3_certification_landscape_R.pdf \
            figures/R/rendered/figure3_certification_landscape_R.svg; do
            test -s "$f" || { echo "Missing or empty output: $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: figure3-certification-landscape
          path: |
            figures/R/rendered/figure3_certification_landscape_R.png
            figures/R/rendered/figure3_certification_landscape_R.pdf
            figures/R/rendered/figure3_certification_landscape_R.svg
      - name: Commit rendered outputs
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cp figures/R/rendered/figure3_certification_landscape_R.{png,pdf,svg} "$tmp"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp "$tmp"/figure3_certification_landscape_R.* figures/R/rendered/
          git add figures/R/rendered/figure3_certification_landscape_R.{png,pdf,svg}
          if git diff --cached --quiet; then
            echo "Figure 3 outputs unchanged."
            exit 0
          fi
          git commit -m "figure: render Figure 3 formal outputs"
          git push origin HEAD:main
