name: General-QOAC law P3b slab cohort

on:
  workflow_dispatch:
  push:
    branches:
      - research/general-qoac-law-confirm-20261006
    paths:
      - analysis/general_qoac_law/P3B_PHASE
      - .github/workflows/general_qoac_law.yml

permissions:
  contents: write

concurrency:
  group: general-qoac-law-p3b-20261006
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      phase: ${{ steps.p.outputs.phase }}
      materials: ${{ steps.p.outputs.materials }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - id: p
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.4.6 scipy==1.18.1 pandas==2.3.3
          (cd analysis/general_qoac_law && python -m unittest -q test_policy_codec.py)
          (cd analysis/qoac_v03_rdo && python -m unittest -q test_codec_qoac_v03.py)
          (cd analysis/general_qoac_operators && python -m unittest -q test_operators.py test_gain_predictors.py)
          phase=$(tr -d '[:space:]' < analysis/general_qoac_law/P3B_PHASE)
          [ "$phase" = select ] || [ "$phase" = predict ] || [ "$phase" = run ] || { echo "bad phase"; exit 1; }
          F=analysis/fresh_population_20261006
          mats=$(python -c "import pandas as pd,json;ids=[]
          import os
          for f in ('$F/P3B_CONFIRMATORY_MANIFEST.csv',): ids+=[(f,m) for m in (pd.read_csv(f).material_id if os.path.exists(f) else [])]
          print(json.dumps([{'manifest':f,'id':m} for f,m in ids] or [{'manifest':'none','id':'none'}]))")
          if [ "$phase" = run ]; then
            python - <<'EOF'
          import pandas as pd, pathlib, sys
          F='analysis/fresh_population_20261006'; P=pathlib.Path('analysis/general_qoac_law/results/predictions')
          ids=list(pd.read_csv(f'{F}/P3B_CONFIRMATORY_MANIFEST.csv').material_id)
          missing=[m for m in ids if not (P/f'pred_{m}.csv').exists()]
          print('missing predictions:',missing); sys.exit(1 if missing else 0)
          EOF
          fi
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "materials=$mats" >> "$GITHUB_OUTPUT"

  select:
    needs: preflight
    if: needs.preflight.outputs.phase == 'select'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 893f931b3045b0b628329db81999c2f439d4e830
          path: frozen
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r frozen/validation/requirements-external-e2e.txt
      - name: Select P3b and commit the manifest
        shell: bash
        run: |
          set -euo pipefail
          python analysis/fresh_population_20261006/scripts/select_p3b.py --repo-root .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/fresh_population_20261006/P3B_CONFIRMATORY_MANIFEST.csv analysis/fresh_population_20261006/p3b_attempts.csv
          git commit -m 'fresh-population: draw P3b slab cohort under the frozen rule (metadata only)'
          git pull --rebase origin research/general-qoac-law-confirm-20261006
          git push origin HEAD:research/general-qoac-law-confirm-20261006

  shard:
    needs: preflight
    if: needs.preflight.outputs.phase != 'select'
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        item: ${{ fromJSON(needs.preflight.outputs.materials) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: 893f931b3045b0b628329db81999c2f439d4e830
          path: frozen
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: frozen/validation/requirements-external-e2e.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r frozen/validation/requirements-external-e2e.txt
      - name: Run material
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/law_${{ matrix.item.id }}"; mkdir -p "$out"
          if [ "${{ needs.preflight.outputs.phase }}" = predict ]; then
            python repo/analysis/general_qoac_law/run_part_b.py --phase predict --repo-root repo --frozen-root frozen \
              --manifest "repo/${{ matrix.item.manifest }}" --cache-dir "$RUNNER_TEMP/cache" --output-dir "$out" --only "${{ matrix.item.id }}"
          else
            python repo/analysis/general_qoac_law/run_part_b.py --phase run --repo-root repo --frozen-root frozen \
              --manifest "repo/${{ matrix.item.manifest }}" --cache-dir "$RUNNER_TEMP/cache" --output-dir "$out" --only "${{ matrix.item.id }}"
            python repo/analysis/general_qoac_law/run_part_a.py --repo-root repo --frozen-root frozen \
              --manifest "repo/${{ matrix.item.manifest }}" --cache-dir "$RUNNER_TEMP/cache" --output-dir "$out" --only "${{ matrix.item.id }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lawp3b-${{ needs.preflight.outputs.phase }}-${{ matrix.item.id }}
          path: ${{ runner.temp }}/law_${{ matrix.item.id }}
          if-no-files-found: error

  aggregate:
    if: always() && needs.preflight.result == 'success' && needs.preflight.outputs.phase != 'select'
    needs: [preflight, shard]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -q numpy==2.3.5 pandas==2.3.3 scipy==1.18.1
      - uses: actions/download-artifact@v4
        with:
          pattern: lawp3b-${{ needs.preflight.outputs.phase }}-*
          path: shards
      - name: Collect, aggregate and commit
        shell: bash
        run: |
          set -euo pipefail
          R=analysis/general_qoac_law/results; F=analysis/fresh_population_20261006
          if [ "${{ needs.preflight.outputs.phase }}" = predict ]; then
            mkdir -p $R/predictions; find shards -name 'pred_*.csv' -exec cp {} $R/predictions/ \;
            find shards -name 'failure_*' -exec cp {} $R/predictions/ \; || true
            git add $R/predictions; msg="research: commit P3b law predictions (before any compression run)"
          else
            python analysis/general_qoac_law/aggregate_law.py --manifest $F/P3B_CONFIRMATORY_MANIFEST.csv --shards-root shards \
              --predictions-dir $R/predictions --output-dir $R/run_P3B_CONFIRMATORY
            git add $R/run_P3B_*; msg="research: complete P3b slab law confirmation run"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "$msg" || exit 0
          git pull --rebase origin research/general-qoac-law-confirm-20261006
          git push origin HEAD:research/general-qoac-law-confirm-20261006
