name: JCTC manuscript v0.2

on:
  push:
    branches:
      - submission/jctc-v0.1
    paths:
      - 'submission/RUN_JCTC_MANUSCRIPT_V02.txt'

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: submission/jctc-v0.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lint manuscript v0.2
        shell: bash
        run: |
          set -o pipefail
          python analysis/lint_jctc_manuscript_v02.py | tee submission/jctc_v02_lint_stdout.txt
      - name: Commit lint report
        run: |
          git config user.name 'chatgpt-analysis-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add submission/JCTC_MANUSCRIPT_v0.2_LINT.md submission/jctc_v02_lint_stdout.txt
          if git diff --cached --quiet; then
            echo 'No lint changes.'
          else
            git commit -m 'Lint JCTC manuscript v0.2'
            git pull --rebase origin submission/jctc-v0.1
            git push origin HEAD:submission/jctc-v0.1
          fi
