name: Private SI R render encrypted handoff

on:
  push:
    branches: [review/private-si-assets-build-20260916]
    paths:
      - '.github/workflows/private_si_r_render.yml'

permissions:
  contents: read

env:
  SOURCE_COMMIT: 5eabc39476b3e9d3a1ddebd46169bc29aaca877c

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ggplot2
            any::dplyr
            any::tidyr
            any::scales
            any::patchwork
            any::svglite
      - name: Recover frozen private source in runner temp space
        shell: bash
        run: |
          set -euo pipefail
          mkdir source
          git archive "$SOURCE_COMMIT" | tar -x -C source
          test -f source/figures/R/supplement/figureS5_bader_implementation_robustness.R
      - name: Apply submission-facing terminology patches only
        shell: bash
        run: |
          set -euo pipefail
          cd source
          perl -0pi -e 's/Paired archived float32-probe vs five-seed QSQ floors/Paired archived float32-probe vs five-seed operational QSQ response scales/g; s/Archived float32-probe floor \(e\)/Archived float32-probe response scale (e)/g; s/QSQ stability floor \(e\)/Operational QSQ response scale (e)/g; s/paired archived and QSQ floors/paired archived and QSQ response scales/g' figures/R/supplement/figureS1_stability_floor_landscape.R
          perl -0pi -e 's/Within-material log10 floor span across five seeds \(decades\)/Within-material log10 QSQ-response-scale span across five seeds (decades)/g; s/x0\.1 -> x10 floor shift/x0.1 -> x10 response-scale shift/g; s/The floor is qualification-defined, not amplitude-free/The response scale is qualification-defined, not amplitude-free/g; s/Re-derived Bader floor \(e\)/Re-derived Bader response scale (e)/g' figures/R/supplement/figureS2_probe_seed_amplitude.R
          perl -0pi -e 's/Certified Bader error is floor-scale only at the strictest contract/Certified Bader error approaches the QSQ response scale only at the strictest contract/g; s/Re-derived Bader error \/ QSQ floor/Re-derived Bader error \/ QSQ response scale/g; s/Error versus floor/Error versus QSQ response scale/g; s/QSQ stability floor \(e\)/Operational QSQ response scale (e)/g; s/relative to the floor/relative to the QSQ response scale/g; s/The strictest certified Bader regime is floor-scale, not a universal plateau/The strictest certified Bader regime approaches the QSQ response scale, not a universal plateau/g; s/Independent QSQ stability floors provide the numerical reference scale/Independent operational QSQ response scales provide the numerical reference scale/g; s/error\/floor summaries/error\/response-scale summaries/g; s/the QSQ floor/the QSQ response scale/g' figures/R/supplement/figureS4_tight_floor_scale.R
          perl -0pi -e 's/Absolute stability floors depend on the basin implementation/Operational QSQ response scales depend on basin implementation/g; s/BaderKit on-grid QSQ floor \(e\)/BaderKit on-grid QSQ response scale (e)/g; s/Independent implementation QSQ floor \(e\)/Independent implementation QSQ response scale (e)/g; s/stability-floor cross-checks/response-scale cross-checks/g; s/absolute numerical floor/operational numerical response scale/g' figures/R/supplement/figureS5_bader_implementation_robustness.R
          grep -RniE '"[^"\n]*(QSQ stability floor|QSQ floor|Absolute stability floors|Re-derived Bader floor|The floor is qualification-defined)[^"\n]*"' figures/R/supplement/*.R && exit 1 || true
      - name: Render all publication supplementary figures from R
        shell: bash
        run: |
          set -euo pipefail
          cd source
          for f in \
            figures/R/supplement/figureS1_stability_floor_landscape.R \
            figures/R/supplement/figureS2_probe_seed_amplitude.R \
            figures/R/supplement/figureS3_operator_controls.R \
            figures/R/supplement/figureS4_tight_floor_scale.R \
            figures/R/supplement/figureS5_bader_implementation_robustness.R \
            figures/R/supplement/figureS6_matching_sensitivity.R \
            figures/R/supplement/figureS7_reclassification_by_codec.R \
            figures/R/supplement/figureS8_external_confirmation.R; do
              Rscript "$f"
          done
          mkdir -p ../bundle
          for n in 1 2 3 4 5 6 7 8; do
            files=(figures/R/rendered/supplementary_figureS${n}_*_R.png figures/R/rendered/supplementary_figureS${n}_*_R.pdf figures/R/rendered/supplementary_figureS${n}_*_R.svg)
            for f in "${files[@]}"; do test -s "$f"; cp "$f" ../bundle/; done
          done
          cd ../bundle
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 24
          sha256sum * | sort > SHA256SUMS.txt
      - name: Encrypt rendered bytes before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          cat > build_pub.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA3Mt1XQSu1ofV3Q+YqH6p
          +FYGge7cfzwjQ0ugghpp1aVvxhhlFZOPdOQZe7L3MPuCL43RT1C7tibtok+lggNp
          bzPMhwb53wU+BbauagscmIO8u53ZQ2whv4EcDV1HKh6mWM9ycv4gmyC9jLanknZE
          CwIbSffqmoRAFBT5WP30OwwjYqghi7cA6PrriVQnA6yv2VfEdPURnYTR263W1/MA
          2y3/8lv4MA5sab2CdJGq4nJtkAuglnu6Jr+zwa1NeifJiQmJG1Jj/PGC+DuGPzxA
          uMtl2eHVyW0Pd2IlH6H0zPbhq/FbBsmAGffkZUVvzF9jPREO24EGJDUupsevadSy
          xmIU2YozNjtDeJtijMvZQUJW08v3hb4jxiA+VtvwpKER/4Y5bHaKcNcp3ea6pSJ1
          UQCftsNBoUCZ9VYfaQbnfLSbh7YnOKQqDoVw/gcSkJetlp0MyyIAt6IyGM1rgjhU
          W1BZRSzw0P676ZomsM6EUnAgW0hkA84UbIBKCaCOFDqdAgMBAAE=
          -----END PUBLIC KEY-----
          EOF
          sed -i 's/^          //' build_pub.pem
          tar -C bundle -czf si-figures-private.tgz .
          openssl rand -hex 32 > handoff.key
          openssl enc -aes-256-cbc -salt -pbkdf2 -in si-figures-private.tgz -out si-figures-private.tgz.enc -pass file:handoff.key
          openssl pkeyutl -encrypt -pubin -inkey build_pub.pem -in handoff.key -out handoff.key.enc
          rm -f handoff.key si-figures-private.tgz build_pub.pem
          printf 'source_commit=%s\nfigure_sets=8\nformats_per_figure=3\nrendered_files=24\nplaintext_uploaded=false\n' "$SOURCE_COMMIT" > PUBLIC_QA.txt
          sha256sum si-figures-private.tgz.enc handoff.key.enc >> PUBLIC_QA.txt
          cat PUBLIC_QA.txt
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-private-si-renders-20260916
          path: |
            si-figures-private.tgz.enc
            handoff.key.enc
            PUBLIC_QA.txt
          retention-days: 1
