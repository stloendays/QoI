name: General-QOAC electric-field beta map

on:
  workflow_dispatch:
  push:
    branches:
      - research/general-qoac-electric-field-beta-map-20261005
    paths:
      - analysis/general_qoac_electric_field_beta_map/**
      - .github/workflows/general_qoac_electric_field_beta_map.yml

permissions:
  contents: write

concurrency:
  group: general-qoac-electric-field-beta-map-20261005
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Verify frozen base and beta-map scripts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install numpy==2.3.5 pandas==2.3.3
          python -m py_compile repo/analysis/general_qoac_electric_field_beta_map/*.py
          test "$(( $(wc -l < repo/analysis/general_qoac_electric_field/results/engineering_rows.csv) - 1 ))" -eq 900
          test "$(( $(wc -l < repo/analysis/operator_aware_codec_hartree/results/PILOT_MANIFEST.csv) - 1 ))" -eq 12
          cd repo/analysis/general_qoac_electric_field
          python -m unittest -v test_electric_field_operator.py

  shard:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: 893f931b3045b0b628329db81999c2f439d4e830
          path: frozen
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: frozen/validation/requirements-external-e2e.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r frozen/validation/requirements-external-e2e.txt
      - name: Execute extra beta shard
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/general_qoac_beta_map_${{ matrix.shard }}"
          python repo/analysis/general_qoac_electric_field_beta_map/run_extra_betas.py \
            --repo-root repo \
            --manifest repo/analysis/operator_aware_codec_hartree/results/PILOT_MANIFEST.csv \
            --shard-count 6 \
            --shard-index ${{ matrix.shard }} \
            --output-dir "$out"
          git -C repo rev-parse HEAD > "$out/research_branch_commit.txt"
          git -C frozen rev-parse HEAD > "$out/frozen_scientific_commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: general-qoac-efield-beta-map-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/general_qoac_beta_map_${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 30

  aggregate:
    if: always()
    needs: shard
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install numpy==2.3.5 pandas==2.3.3
      - uses: actions/download-artifact@v4
        with:
          pattern: general-qoac-efield-beta-map-shard-*
          path: shards
          merge-multiple: true
      - name: Aggregate beta map
        shell: bash
        run: |
          set -euo pipefail
          out=repo/analysis/general_qoac_electric_field_beta_map/results
          rm -rf "$out"
          python repo/analysis/general_qoac_electric_field_beta_map/aggregate_beta_map.py \
            --base-rows repo/analysis/general_qoac_electric_field/results/engineering_rows.csv \
            --new-shards-root shards \
            --manifest repo/analysis/operator_aware_codec_hartree/results/PILOT_MANIFEST.csv \
            --output-dir "$out"
          python --version > "$out/python_version.txt" 2>&1
          python -m pip freeze | sort > "$out/pip_freeze.txt"
          git -C repo rev-parse HEAD > "$out/research_branch_commit_before_results.txt"
          echo "893f931b3045b0b628329db81999c2f439d4e830" > "$out/frozen_scientific_commit.txt"
      - name: Commit beta-map results
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/general_qoac_electric_field_beta_map/results
          if git diff --cached --quiet; then
            echo 'No result changes.'
          else
            git commit -m 'research: complete electric-field finite-rate beta map'
            git pull --rebase origin research/general-qoac-electric-field-beta-map-20261005
            git push origin HEAD:research/general-qoac-electric-field-beta-map-20261005
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: general-qoac-efield-beta-map
          path: repo/analysis/general_qoac_electric_field_beta_map/results
          if-no-files-found: warn
          retention-days: 90
