name: Render Supplementary Figure S5 Bader robustness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'figures/R/supplement/figureS5_bader_implementation_robustness.R'
      - '.github/workflows/render_supplementary_figureS5.yml'
      - 'mechanism/independent_bader_20260908/mechanism_domain_decomposition.csv'
      - 'mechanism/independent_bader_20260908/stability_comparison.csv'
      - 'supplement/S11_cross_implementation_pairs.csv'
      - 'supplement/S11_independent_implementation_summary.csv'
      - 'supplement/S11_spatial_control_summary.csv'

permissions:
  contents: write

concurrency:
  group: qoi-formal-figure-writeback
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ggplot2
            any::dplyr
            any::tidyr
            any::scales
            any::patchwork
            any::svglite
      - name: Render Supplementary Figure S5
        run: Rscript figures/R/supplement/figureS5_bader_implementation_robustness.R
      - name: Validate outputs
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            figures/R/rendered/supplementary_figureS5_bader_implementation_robustness_R.png \
            figures/R/rendered/supplementary_figureS5_bader_implementation_robustness_R.pdf \
            figures/R/rendered/supplementary_figureS5_bader_implementation_robustness_R.svg; do
            test -s "$f" || { echo "Missing or empty output: $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: supplementary-figure-S5-bader-robustness
          path: figures/R/rendered/supplementary_figureS5_bader_implementation_robustness_R.*
      - name: Commit rendered outputs
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cp figures/R/rendered/supplementary_figureS5_bader_implementation_robustness_R.* "$tmp"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp "$tmp"/supplementary_figureS5_bader_implementation_robustness_R.* figures/R/rendered/
          git add figures/R/rendered/supplementary_figureS5_bader_implementation_robustness_R.*
          if git diff --cached --quiet; then
            echo "Supplementary Figure S5 outputs unchanged."
            exit 0
          fi
          git commit -m "figure: render Supplementary Figure S5"
          git push origin HEAD:main
