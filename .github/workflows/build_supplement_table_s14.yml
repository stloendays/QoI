name: Build Supplementary Table S14

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_supplement_table_s14_20260911.py'
      - '.github/workflows/build_supplement_table_s14.yml'
      - 'failure_registry.csv'
      - 'paper/CLAIM_EVIDENCE_MATRIX.md'

permissions:
  contents: write

concurrency:
  group: qoi-submission-table-writeback
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build S14
        run: python scripts/build_supplement_table_s14_20260911.py
      - name: Validate
        run: |
          test -s paper/SUPPLEMENTARY_TABLE_S14_20260911.md
          test -s supplement/S14_failure_registry_summary.csv
          git diff --check -- paper/SUPPLEMENTARY_TABLE_S14_20260911.md scripts/build_supplement_table_s14_20260911.py
      - name: Commit generated outputs
        run: |
          paths=(paper/SUPPLEMENTARY_TABLE_S14_20260911.md supplement/S14_failure_registry_summary.csv)
          if [ -z "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo 'No changes to commit.'
            exit 0
          fi
          tmp=$(mktemp -d)
          cp paper/SUPPLEMENTARY_TABLE_S14_20260911.md supplement/S14_failure_registry_summary.csv "$tmp"/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          cp "$tmp/SUPPLEMENTARY_TABLE_S14_20260911.md" paper/
          cp "$tmp/S14_failure_registry_summary.csv" supplement/
          git add "${paths[@]}"
          git commit -m 'supplement: build Table S14 failure taxonomy'
          git push origin HEAD:main
