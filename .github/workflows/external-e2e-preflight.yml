name: External E2E Preflight

on:
  workflow_dispatch:
  push:
    branches: [external-e2e-validation]
    paths:
      - '.github/workflows/external-e2e-preflight.yml'
      - 'validation/preflight_formal_external.py'
      - 'validation/preflight_confirmatory_split.py'
      - 'validation/external_rate_fidelity_split.json'
      - 'validation/aggregate_formal_external.py'
      - 'validation/build_confirmatory_external.py'
      - 'validation/test_aggregate_semantics.py'
      - 'validation/test_confirmatory_postprocessor.py'
      - 'external_test_MANIFEST.json'
      - 'stability/stability_floor_A1.csv'
      - 'benchmark/master_benchmark_full.csv'
      - 'benchmark/master_benchmark_tight_ladder.csv'

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen 65-system benchmark invariants
        run: python validation/preflight_formal_external.py
      - name: Verify frozen confirmatory 65/2/63 split
        run: python validation/preflight_confirmatory_split.py
      - name: Verify material-level aggregation semantics
        run: python validation/test_aggregate_semantics.py
      - name: Verify all65 to confirmatory63 postprocessing
        run: python validation/test_confirmatory_postprocessor.py
