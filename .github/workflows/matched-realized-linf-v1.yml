name: Matched realized-Linf V1

on:
  workflow_dispatch:
  push:
    branches:
      - 'analysis/matched-realized-linf-v1'
    paths:
      - 'analysis/matched_realized_linf_v1.py'
      - '.github/workflows/matched-realized-linf-v1.yml'
      - 'benchmark/master_benchmark_full.csv'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4
        with:
          ref: analysis/matched-realized-linf-v1
          fetch-depth: 0

      - name: Show benchmark metadata
        run: |
          python --version
          ls -lh benchmark/master_benchmark_full.csv
          sha256sum benchmark/master_benchmark_full.csv

      - name: Run matched realized-Linf analysis
        run: python analysis/matched_realized_linf_v1.py

      - name: Print report
        run: |
          echo '--- REPORT.md ---'
          cat analysis/matched_realized_linf_v1/REPORT.md
          echo '--- matching diagnostics ---'
          cat analysis/matched_realized_linf_v1/matching_diagnostics.csv

      - name: Upload analysis outputs
        uses: actions/upload-artifact@v4
        with:
          name: matched-realized-linf-v1
          path: analysis/matched_realized_linf_v1/
          if-no-files-found: error

      - name: Commit reproducible results to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/matched_realized_linf_v1/
          if git diff --cached --quiet; then
            echo 'No analysis-result changes to commit.'
          else
            git commit -m 'Run matched realized-Linf V1 analysis'
            git push origin HEAD:analysis/matched-realized-linf-v1
          fi
