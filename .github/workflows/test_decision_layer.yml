name: Test QSQ decision layer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/recommend_codec.py
      - tests/test_recommend_codec.py
      - decision/**
      - .github/workflows/test_decision_layer.yml
  push:
    branches: [main]
    paths:
      - scripts/recommend_codec.py
      - tests/test_recommend_codec.py
      - decision/**
      - .github/workflows/test_decision_layer.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit-test decision guardrails
        run: python -m unittest discover -s tests -p 'test_recommend_codec.py' -v
      - name: Smoke-test frozen benchmark schema
        run: |
          python scripts/recommend_codec.py \
            --material-id mp-1065204 \
            --tau 1e-4 \
            --objective max-compression \
            --output /tmp/decision.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/decision.json').read_text())
          assert result['status'] == 'CERTIFIED_RECOMMENDATION', result
          assert result['recommendation'] is not None, result
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
