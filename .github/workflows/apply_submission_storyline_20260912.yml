name: Integrate submission storyline

on:
  push:
    branches:
      - paper/submission-storyline-20260912
    paths:
      - 'scripts/apply_submission_storyline_20260912.py'
      - 'paper/SUBMISSION_STORYLINE_PATCH_20260912.md'
      - '.github/workflows/apply_submission_storyline_20260912.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: paper/submission-storyline-20260912
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Apply deterministic storyline patch
        run: python scripts/apply_submission_storyline_20260912.py
      - name: Verify submission interpretation locks
        shell: bash
        run: |
          set -euo pipefail
          grep -q '20.34-fold' paper/MANUSCRIPT_TOP_JOURNAL_POLISHED_20260911.md
          grep -q '50.83-fold' paper/MANUSCRIPT_TOP_JOURNAL_POLISHED_20260911.md
          grep -q '14,986/14,986' paper/MANUSCRIPT_TOP_JOURNAL_POLISHED_20260911.md
          grep -q 'Historical binary-to-three-state sensitivity audit' paper/MANUSCRIPT_TOP_JOURNAL_POLISHED_20260911.md
          grep -q 'INTEGRATED ON SUBMISSION STORYLINE BRANCH' paper/SUBMISSION_STORYLINE_PATCH_20260912.md
          ! grep -q 'more than 95% of apparent binary failures cannot be scientifically attributed to the compressor' paper/MANUSCRIPT_TOP_JOURNAL_POLISHED_20260911.md
      - name: Commit integrated manuscript
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/MANUSCRIPT_TOP_JOURNAL_POLISHED_20260911.md paper/SUBMISSION_STORYLINE_PATCH_20260912.md
          if git diff --cached --quiet; then
            echo 'Submission storyline already integrated.'
          else
            git commit -m 'paper: integrate prospective QSQ submission storyline'
            git pull --rebase origin paper/submission-storyline-20260912
            git push origin HEAD:paper/submission-storyline-20260912
          fi
