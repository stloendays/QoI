name: Render Figure 7 external confirmation

on:
  workflow_dispatch:
  push:
    paths:
      - 'figures/R/figure7_external_confirmation.R'
      - '.github/workflows/render_figure7_external_confirmation.yml'
      - 'validation/final_external_confirmatory63_20260908/confirmatory63/**'

permissions:
  contents: write

concurrency:
  group: qoi-formal-figure-writeback
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ggplot2
            any::dplyr
            any::scales
            any::patchwork
            any::jsonlite
            any::svglite
      - name: Render Figure 7
        run: Rscript figures/R/figure7_external_confirmation.R
      - name: Validate Figure 7 outputs
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            figures/R/rendered/figure7_external_confirmation_R.png \
            figures/R/rendered/figure7_external_confirmation_R.pdf \
            figures/R/rendered/figure7_external_confirmation_R.svg; do
            test -s "$f" || { echo "Missing or empty output: $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: figure7-external-confirmation
          path: |
            figures/R/rendered/figure7_external_confirmation_R.png
            figures/R/rendered/figure7_external_confirmation_R.pdf
            figures/R/rendered/figure7_external_confirmation_R.svg
      - name: Commit rendered outputs
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cp figures/R/rendered/figure7_external_confirmation_R.{png,pdf,svg} "$tmp"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp "$tmp"/figure7_external_confirmation_R.* figures/R/rendered/
          git add figures/R/rendered/figure7_external_confirmation_R.{png,pdf,svg}
          if git diff --cached --quiet; then
            echo "Figure 7 outputs unchanged."
            exit 0
          fi
          git commit -m "figure: render Figure 7 formal outputs"
          git push origin HEAD:main
