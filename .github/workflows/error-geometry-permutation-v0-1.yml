name: Error Geometry Permutation v0.1

on:
  push:
    branches: [external-e2e-validation]
    paths:
      - 'mechanism/GEOMETRY_PERMUTATION_V0_1_TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      materials: ${{ steps.select.outputs.materials }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        name: Freeze selected representative bulk materials from released tables
        run: |
          materials=$(python mechanism/residual_spatial_permutation.py --list-materials)
          echo "materials=$materials" >> "$GITHUB_OUTPUT"
          echo "$materials"

  permute:
    needs: select
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        material: ${{ fromJSON(needs.select.outputs.materials) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned benchmark environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r validation/requirements-external-e2e.txt
      - name: Run preregistered five-seed residual permutation
        run: |
          python mechanism/residual_spatial_permutation.py \
            --material-id "${{ matrix.material }}" \
            --output-dir "mechanism/permutation_shards/${{ matrix.material }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geometry-permutation-${{ matrix.material }}
          path: mechanism/permutation_shards/${{ matrix.material }}
          if-no-files-found: warn

  aggregate:
    needs: [select, permute]
    if: ${{ always() && needs.permute.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: geometry-permutation-*
          path: mechanism/permutation_downloads
          merge-multiple: false
      - name: Aggregate at material level
        run: |
          python mechanism/residual_spatial_permutation.py \
            --aggregate-root mechanism/permutation_downloads \
            --output-dir mechanism/geometry_permutation_v0_1
      - name: Show final report
        run: cat mechanism/geometry_permutation_v0_1/RESIDUAL_SPATIAL_PERMUTATION_REPORT.md
      - name: Commit final evidence
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mechanism/geometry_permutation_v0_1/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record preregistered residual spatial-permutation evidence'
          git push
