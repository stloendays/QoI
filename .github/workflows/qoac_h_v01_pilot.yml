name: QOAC-H v0.1 prospective pilot

on:
  workflow_dispatch:
  push:
    branches:
      - research/qoac-h-v01-20261005
    paths:
      - analysis/operator_aware_codec_hartree/**
      - .github/workflows/qoac_h_v01_pilot.yml

permissions:
  contents: write

concurrency:
  group: qoac-h-v01-20261005
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install unit-test dependency
        run: python -m pip install numpy==2.3.5
      - name: Compile and test codec
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile repo/analysis/operator_aware_codec_hartree/*.py
          cd repo/analysis/operator_aware_codec_hartree
          python -m unittest -v test_codec_qoac_h.py
      - name: Freeze pilot manifest before codec execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p manifest
          python repo/analysis/operator_aware_codec_hartree/freeze_pilot_manifest.py \
            --metadata repo/materials_metadata.csv \
            --output manifest/PILOT_MANIFEST.csv \
            --provenance manifest/MANIFEST_PROVENANCE.json
          test "$(( $(wc -l < manifest/PILOT_MANIFEST.csv) - 1 ))" -eq 12
      - uses: actions/upload-artifact@v4
        with:
          name: qoac-h-v01-manifest
          path: manifest
          if-no-files-found: error
          retention-days: 90

  shard:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: 893f931b3045b0b628329db81999c2f439d4e830
          path: frozen
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: frozen/validation/requirements-external-e2e.txt
      - name: Install frozen source/scientific stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r frozen/validation/requirements-external-e2e.txt
      - uses: actions/download-artifact@v4
        with:
          name: qoac-h-v01-manifest
          path: manifest
      - name: Execute pilot shard
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/qoac_h_${{ matrix.shard }}"
          python repo/analysis/operator_aware_codec_hartree/run_pilot.py \
            --repo-root repo \
            --manifest manifest/PILOT_MANIFEST.csv \
            --shard-count 6 \
            --shard-index ${{ matrix.shard }} \
            --output-dir "$out"
          python --version > "$out/python_version.txt" 2>&1
          python -m pip freeze | sort > "$out/pip_freeze.txt"
          git -C repo rev-parse HEAD > "$out/research_branch_commit.txt"
          git -C frozen rev-parse HEAD > "$out/frozen_scientific_commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: qoac-h-v01-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/qoac_h_${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 30

  aggregate:
    if: always()
    needs: shard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install aggregation stack
        run: python -m pip install numpy==2.3.5 pandas==2.3.3
      - uses: actions/download-artifact@v4
        with:
          pattern: qoac-h-v01-shard-*
          path: shards
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: qoac-h-v01-manifest
          path: manifest
      - name: Aggregate frozen gates
        shell: bash
        run: |
          set -euo pipefail
          out=repo/analysis/operator_aware_codec_hartree/results
          rm -rf "$out"
          python repo/analysis/operator_aware_codec_hartree/aggregate_pilot.py \
            --repo-root repo \
            --shards-root shards \
            --manifest manifest/PILOT_MANIFEST.csv \
            --output-dir "$out"
          cp manifest/MANIFEST_PROVENANCE.json "$out/"
          python --version > "$out/aggregate_python_version.txt" 2>&1
          python -m pip freeze | sort > "$out/aggregate_pip_freeze.txt"
          git -C repo rev-parse HEAD > "$out/research_branch_commit_before_results.txt"
          echo "893f931b3045b0b628329db81999c2f439d4e830" > "$out/frozen_scientific_commit.txt"
      - name: Commit pilot result package
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/operator_aware_codec_hartree/results
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
          else
            git commit -m 'research: complete QOAC-H v0.1 prospective pilot'
            git pull --rebase origin research/qoac-h-v01-20261005
            git push origin HEAD:research/qoac-h-v01-20261005
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qoac-h-v01-aggregate
          path: repo/analysis/operator_aware_codec_hartree/results
          if-no-files-found: warn
          retention-days: 90
