name: Error Geometry Control v0.1

on:
  push:
    branches: [external-e2e-validation]
    paths:
      - 'mechanism/GEOMETRY_CONTROL_V0_1_TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  matched-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen development benchmark blob
        run: |
          set -eu
          test "$(git hash-object benchmark/master_benchmark_full.csv)" = "633c7b2ee1b9b800382a5d0d9cfbdc9e1dc793b7"

      - name: Run preregistered dual matching
        run: python mechanism/matched_linf_rmse_control.py

      - name: Show primary result
        run: cat mechanism/geometry_control_v0_1/MATCHED_LINF_RMSE_REPORT.md

      - name: Commit generated evidence
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mechanism/geometry_control_v0_1/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record preregistered dual-metric error-geometry control'
          git push
