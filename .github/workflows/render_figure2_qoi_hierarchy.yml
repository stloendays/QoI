name: Render Figure 2 QoI hierarchy

on:
  workflow_dispatch:
  push:
    paths:
      - 'figures/R/figure2_qoi_hierarchy.R'
      - '.github/workflows/render_figure2_qoi_hierarchy.yml'
      - 'analysis/electron_count_qoi/**'
      - 'analysis/hartree_potential_expansion/**'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ggplot2
            any::dplyr
            any::scales
            any::patchwork
      - name: Render Figure 2
        run: Rscript figures/R/figure2_qoi_hierarchy.R
      - uses: actions/upload-artifact@v4
        with:
          name: figure2-qoi-hierarchy
          path: |
            figures/R/rendered/figure2_qoi_hierarchy_R.png
            figures/R/rendered/figure2_qoi_hierarchy_R.pdf
