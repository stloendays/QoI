name: JCTC SI v0.2

on:
  push:
    branches:
      - submission/jctc-v0.1
    paths:
      - 'submission/RUN_JCTC_SI_V02.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: submission/jctc-v0.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Supporting Information v0.2
        run: python analysis/build_jctc_si_v02.py
      - name: Lint Supporting Information v0.2
        run: python analysis/lint_jctc_si_v02.py
      - name: Commit generated SI and lint
        run: |
          git config user.name 'chatgpt-analysis-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add submission/SUPPORTING_INFORMATION_TEXT_JCTC_v0.2.md submission/JCTC_SI_v0.2_LINT.md
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Build and lint JCTC Supporting Information v0.2'
            git pull --rebase origin submission/jctc-v0.1
            git push origin HEAD:submission/jctc-v0.1
          fi
