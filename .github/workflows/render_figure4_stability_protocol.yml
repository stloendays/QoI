name: Render Figure 4 stability protocol

on:
  workflow_dispatch:
  push:
    paths:
      - 'figures/R/figure4_stability_protocol.R'
      - '.github/workflows/render_figure4_stability_protocol.yml'
      - 'stability/stability_floor_A1.csv'
      - 'stability/stability_floor_A_archived_float32.csv'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ggplot2
            any::dplyr
            any::tidyr
            any::scales
            any::patchwork
            any::svglite
      - name: Render Figure 4
        run: Rscript figures/R/figure4_stability_protocol.R
      - name: Validate Figure 4 outputs
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            figures/R/rendered/figure4_stability_protocol_R.png \
            figures/R/rendered/figure4_stability_protocol_R.pdf \
            figures/R/rendered/figure4_stability_protocol_R.svg; do
            test -s "$f" || { echo "Missing or empty output: $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: figure4-stability-protocol
          path: |
            figures/R/rendered/figure4_stability_protocol_R.png
            figures/R/rendered/figure4_stability_protocol_R.pdf
            figures/R/rendered/figure4_stability_protocol_R.svg
      - name: Commit rendered outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            figures/R/rendered/figure4_stability_protocol_R.png \
            figures/R/rendered/figure4_stability_protocol_R.pdf \
            figures/R/rendered/figure4_stability_protocol_R.svg
          if git diff --cached --quiet; then
            echo "Figure 4 outputs unchanged."
            exit 0
          fi
          git commit -m "figure: render Figure 4 formal outputs"
          git push
