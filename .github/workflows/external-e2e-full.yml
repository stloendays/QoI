name: External E2E Full

on:
  workflow_dispatch:
  push:
    branches: [external-e2e-validation]
    paths:
      - 'validation/FULL_EXTERNAL_TRIGGER'

concurrency:
  group: external-e2e-full
  cancel-in-progress: false

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen scientific stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy \
            baderkit==0.10.2 \
            pysz==1.0.3 \
            zfpy==1.0.1 \
            hdf5plugin==7.0.0 \
            h5py

      - name: Run frozen external shard
        run: |
          python validation/formal_external_e2e.py \
            --codecs zfp,sz3,sperr \
            --shard-count 8 \
            --shard-index ${{ matrix.shard }} \
            --output-dir validation/formal_shard_${{ matrix.shard }}

      - name: Upload shard outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-e2e-shard-${{ matrix.shard }}
          path: validation/formal_shard_${{ matrix.shard }}
          if-no-files-found: error

  aggregate:
    if: always()
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: external-e2e-shard-*
          path: validation/shards

      - name: Aggregate frozen external benchmark
        run: |
          python validation/aggregate_formal_external.py \
            --input-root validation/shards \
            --output-dir validation/formal_external_aggregate \
            --expect-full

      - name: Upload aggregate benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-e2e-full-aggregate
          path: validation/formal_external_aggregate
          if-no-files-found: error
