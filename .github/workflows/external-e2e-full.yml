name: External E2E Full

on:
  workflow_dispatch:
  push:
    branches: [external-e2e-validation]
    paths:
      - 'validation/FULL_EXTERNAL_TRIGGER'

concurrency:
  group: external-e2e-full
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen 65-system corpus and development sampling policy
        run: python validation/preflight_formal_external.py
      - name: Verify frozen 65/2/63 rate-fidelity reporting split
        run: python validation/preflight_confirmatory_split.py
      - name: Verify material-level aggregation semantics
        run: python validation/test_aggregate_semantics.py
      - name: Verify all65 to confirmatory63 postprocessing
        run: python validation/test_confirmatory_postprocessor.py

  shard:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Install frozen external E2E scientific stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r validation/requirements-external-e2e.txt

      - name: Run frozen external shard
        run: |
          python validation/formal_external_e2e.py \
            --codecs zfp,sz3,sperr \
            --shard-count 8 \
            --shard-index ${{ matrix.shard }} \
            --output-dir validation/formal_shard_${{ matrix.shard }}

      - name: Upload shard outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-e2e-shard-${{ matrix.shard }}
          path: validation/formal_shard_${{ matrix.shard }}
          if-no-files-found: error

  aggregate:
    if: always()
    needs: [preflight, shard]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: external-e2e-shard-*
          path: validation/shards

      - name: Aggregate all 65 systems descriptively
        id: all65
        continue-on-error: true
        run: |
          python validation/aggregate_formal_external.py \
            --input-root validation/shards \
            --output-dir validation/formal_external_all65 \
            --expect-full

      - name: Build primary 63-system confirmatory rate-fidelity summary
        if: always()
        id: confirmatory63
        continue-on-error: true
        run: |
          python validation/build_confirmatory_external.py \
            --aggregate-dir validation/formal_external_all65 \
            --output-dir validation/formal_external_confirmatory63

      - name: Print headline aggregate outputs
        if: always()
        run: |
          echo '=== ALL65 SUMMARY ==='
          cat validation/formal_external_all65/summary.json || true
          echo
          echo '=== CONFIRMATORY63 METADATA ==='
          cat validation/formal_external_confirmatory63/confirmatory_metadata.json || true
          echo
          echo '=== CONFIRMATORY63 SUMMARY ==='
          cat validation/formal_external_confirmatory63/summary.json || true
          echo
          echo '=== CONFIRMATORY63 EXTERNAL_SUMMARY_A1 ==='
          cat validation/formal_external_confirmatory63/external_summary_a1.csv || true
          echo
          echo '=== CONFIRMATORY63 PAIRWISE ==='
          cat validation/formal_external_confirmatory63/pairwise_external.csv || true
          echo
          echo '=== ALL65 EXTERNAL_SUMMARY_A1 ==='
          cat validation/formal_external_all65/external_summary_a1.csv || true

      - name: Enforce aggregate validation status
        if: always()
        run: |
          test "${{ steps.all65.outcome }}" = "success"
          test "${{ steps.confirmatory63.outcome }}" = "success"

      - name: Upload external benchmark outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-e2e-full-aggregate
          path: |
            validation/formal_external_all65
            validation/formal_external_confirmatory63
          if-no-files-found: error
