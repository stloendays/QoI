name: HB self-contained joint storage bytes

on:
  push:
    branches: [research/hb-selfcontained-bytes-20261012]
    paths: [analysis/hb_selfcontained_bytes_20261012/RUN_SENTINEL]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hb-selfcontained-bytes-20261012
  cancel-in-progress: false

env:
  MANIFEST: analysis/fresh_population_20261006/P2_CONFIRMATORY_MANIFEST.csv
  BRANCH: research/hb-selfcontained-bytes-20261012
  FROZEN_BADER_COMMIT: 893f931b3045b0b628329db81999c2f439d4e830

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      manifest: ${{ steps.check.outputs.manifest }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install pinned preflight stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.4.6 pandas==2.3.3
      - id: check
        name: Check frozen inputs and unit tests
        shell: bash
        env:
          EXPECTED_MANIFEST_SHA: 361202189512883931c90a9fe62d7cb48fd4f7294a55ae019d781c7c89aafab5
          EXPECTED_BEST_SHA: d740c09a906a85f351f06c9adf8845e3261d64cc834171f5cf9b053caf1a307f
          EXPECTED_MATERIALS_SHA: e302831dc8c133dc674c21581bc5c759dc994c4baf481cdaa5eb7307628da73b
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/$BRANCH" ]; then
            echo "dispatch this workflow from $BRANCH (got $GITHUB_REF)" >&2
            exit 1
          fi
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          checks = {
              "repo/analysis/fresh_population_20261006/P2_CONFIRMATORY_MANIFEST.csv": os.environ["EXPECTED_MANIFEST_SHA"],
              "repo/analysis/qoac_hb_v2/results/P2_CONFIRMATORY_MANIFEST/joint_v2_best_post.csv": os.environ["EXPECTED_BEST_SHA"],
              "repo/analysis/qoac_hb_v2/results/P2_CONFIRMATORY_MANIFEST/materials.csv": os.environ["EXPECTED_MATERIALS_SHA"],
          }
          for name, expected in checks.items():
              path = Path(name)
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              print(f"{name}: {digest}")
              if digest != expected:
                  raise SystemExit(f"SHA-256 mismatch for {name}: {digest} != {expected}")
          manifest = Path("repo") / os.environ["MANIFEST"]
          rows = manifest.read_text(encoding="utf-8").splitlines()
          if len(rows) - 1 != 48:
              raise SystemExit(f"expected 48 confirmatory materials, got {len(rows) - 1}")
          PY
          python -m py_compile repo/analysis/hb_selfcontained_bytes_20261012/*.py
          (cd repo/analysis/hb_selfcontained_bytes_20261012 && python -m unittest -q test_selfcontained.py)
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"

  shard:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: 893f931b3045b0b628329db81999c2f439d4e830
          path: frozen
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: frozen/validation/requirements-external-e2e.txt
      - name: Install frozen scientific requirements
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran
          python -m pip install --upgrade pip
          python -m pip install -r frozen/validation/requirements-external-e2e.txt
      - name: Build Henkelman Bader
        shell: bash
        run: |
          set -euo pipefail
          cp -r repo/mechanism/independent_bader_20260908/reference_source "$RUNNER_TEMP/bader_source"
          cd "$RUNNER_TEMP/bader_source"
          sed -i 's/^LINK = -static/LINK =/' makefile.osx_gfortran
          make -f makefile.osx_gfortran
          test -x bader
      - name: Run shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          MANIFEST: ${{ needs.preflight.outputs.manifest }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/hb_selfcontained_bytes_${SHARD}"
          python repo/analysis/hb_selfcontained_bytes_20261012/run_selfcontained.py \
            --manifest "repo/$MANIFEST" \
            --shard-count 8 --shard-index "$SHARD" \
            --bader "$RUNNER_TEMP/bader_source/bader" \
            --output-dir "$out"
          git -C repo rev-parse HEAD > "$out/research_branch_commit.txt"
          git -C frozen rev-parse HEAD > "$out/frozen_scientific_commit.txt"
          python -m pip freeze > "$out/pip_freeze.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: hb-selfcontained-bytes-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/hb_selfcontained_bytes_${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 30

  aggregate:
    if: always() && needs.preflight.result == 'success'
    needs: [preflight, shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install pinned aggregate stack
        run: python -m pip install numpy==2.3.5 pandas==2.3.3
      - uses: actions/download-artifact@v4
        with:
          pattern: hb-selfcontained-bytes-shard-*
          path: shards
      - name: Aggregate self-contained bytes
        shell: bash
        env:
          MANIFEST: ${{ needs.preflight.outputs.manifest }}
        run: |
          set -euo pipefail
          cd repo
          out="analysis/hb_selfcontained_bytes_20261012/results"
          rm -rf "$out"
          python analysis/hb_selfcontained_bytes_20261012/aggregate_selfcontained.py \
            --manifest "$MANIFEST" --shards-root ../shards --output-dir "$out"
          git rev-parse HEAD > "$out/research_branch_commit_before_results.txt"
          echo "$FROZEN_BADER_COMMIT" > "$out/frozen_scientific_commit.txt"
          python --version > "$out/python_version.txt" 2>&1
          python -m pip freeze | sort > "$out/pip_freeze.txt"
      - name: Commit results
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/hb_selfcontained_bytes_20261012/results
          if git diff --cached --quiet; then
            echo 'No result changes.'
          else
            git commit -m 'research: complete HB self-contained bytes analysis'
            git pull --rebase origin research/hb-selfcontained-bytes-20261012
            git push origin HEAD:research/hb-selfcontained-bytes-20261012
          fi
