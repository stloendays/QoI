name: Render Supplementary Figure S8 external confirmation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'figures/R/supplement/figureS8_external_confirmation.R'
      - '.github/workflows/render_supplementary_figureS8.yml'
      - 'supplement/S13_rate_fidelity_summary.csv'
      - 'supplement/S13_pairwise_sz3_zfp.csv'

permissions:
  contents: write

concurrency:
  group: qoi-formal-figure-writeback
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ggplot2
            any::dplyr
            any::scales
            any::patchwork
            any::svglite
      - name: Render Supplementary Figure S8
        run: Rscript figures/R/supplement/figureS8_external_confirmation.R
      - name: Validate outputs
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            figures/R/rendered/supplementary_figureS8_external_confirmation_R.png \
            figures/R/rendered/supplementary_figureS8_external_confirmation_R.pdf \
            figures/R/rendered/supplementary_figureS8_external_confirmation_R.svg; do
            test -s "$f" || { echo "Missing or empty output: $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: supplementary-figure-S8-external-confirmation
          path: figures/R/rendered/supplementary_figureS8_external_confirmation_R.*
      - name: Commit rendered outputs
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cp figures/R/rendered/supplementary_figureS8_external_confirmation_R.* "$tmp"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp "$tmp"/supplementary_figureS8_external_confirmation_R.* figures/R/rendered/
          git add figures/R/rendered/supplementary_figureS8_external_confirmation_R.*
          if git diff --cached --quiet; then
            echo "Supplementary Figure S8 outputs unchanged."
            exit 0
          fi
          git commit -m "figure: render Supplementary Figure S8"
          git push origin HEAD:main
