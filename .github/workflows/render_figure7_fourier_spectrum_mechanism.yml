name: Render Figure 7 Fourier-spectrum mechanism

on:
  workflow_dispatch:
  push:
    branches:
      - paper/fourier-mechanism-integration-20260927
    paths:
      - 'figures/R/figure7_fourier_spectrum_mechanism.R'
      - '.github/workflows/render_figure7_fourier_spectrum_mechanism.yml'
      - 'analysis/hartree_spectral_mechanism/results/**'

permissions:
  contents: write

concurrency:
  group: qoi-figure7-fourier-mechanism
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ggplot2
            any::dplyr
            any::scales
            any::patchwork
            any::jsonlite
            any::svglite

      - name: Render Figure 7
        run: Rscript figures/R/figure7_fourier_spectrum_mechanism.R

      - name: Validate Figure 7 outputs
        shell: bash
        run: |
          set -euo pipefail
          for f in             figures/R/rendered/figure7_fourier_spectrum_mechanism_R.png             figures/R/rendered/figure7_fourier_spectrum_mechanism_R.pdf             figures/R/rendered/figure7_fourier_spectrum_mechanism_R.svg; do
            test -s "$f" || { echo "Missing or empty output: $f"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: figure7-fourier-spectrum-mechanism
          path: |
            figures/R/rendered/figure7_fourier_spectrum_mechanism_R.png
            figures/R/rendered/figure7_fourier_spectrum_mechanism_R.pdf
            figures/R/rendered/figure7_fourier_spectrum_mechanism_R.svg
          retention-days: 90

      - name: Commit rendered outputs to manuscript branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/R/rendered/figure7_fourier_spectrum_mechanism_R.{png,pdf,svg}
          if git diff --cached --quiet; then
            echo "Figure 7 outputs unchanged."
            exit 0
          fi
          git commit -m "figure: render Fourier-spectrum mechanism outputs"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
