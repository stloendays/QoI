name: Render Figure 8 external confirmation

on:
  workflow_dispatch:
  push:
    branches:
      - paper/fourier-mechanism-integration-20260927
    paths:
      - 'figures/R/figure8_external_confirmation.R'
      - '.github/workflows/render_figure8_external_confirmation.yml'
      - 'validation/final_external_confirmatory63_20260908/confirmatory63/**'

permissions:
  contents: write

concurrency:
  group: qoi-figure8-external-confirmation
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ggplot2
            any::dplyr
            any::scales
            any::patchwork
            any::jsonlite
            any::svglite

      - name: Render Figure 8
        run: Rscript figures/R/figure8_external_confirmation.R

      - name: Validate Figure 8 outputs
        shell: bash
        run: |
          set -euo pipefail
          for f in             figures/R/rendered/figure8_external_confirmation_R.png             figures/R/rendered/figure8_external_confirmation_R.pdf             figures/R/rendered/figure8_external_confirmation_R.svg; do
            test -s "$f" || { echo "Missing or empty output: $f"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: figure8-external-confirmation
          path: |
            figures/R/rendered/figure8_external_confirmation_R.png
            figures/R/rendered/figure8_external_confirmation_R.pdf
            figures/R/rendered/figure8_external_confirmation_R.svg
          retention-days: 90

      - name: Commit rendered outputs to manuscript branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/R/rendered/figure8_external_confirmation_R.{png,pdf,svg}
          if git diff --cached --quiet; then
            echo "Figure 8 outputs unchanged."
            exit 0
          fi
          git commit -m "figure: render Figure 8 external confirmation outputs"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
