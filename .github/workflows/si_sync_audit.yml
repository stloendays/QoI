name: SI sync audit

on:
  push:
    branches: [review/si-sync-audit-20260916]
    paths:
      - '.github/workflows/si_sync_audit.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_COMMIT: 5eabc39476b3e9d3a1ddebd46169bc29aaca877c
  SI_PATH: paper/SUPPLEMENTARY_INFORMATION_DRAFT_20260911.md

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover frozen SI without publishing it
        shell: bash
        run: |
          set -euo pipefail
          git show "${SOURCE_COMMIT}:${SI_PATH}" > si_source.md

      - name: Audit manuscript-SI synchronization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path

          t = Path('si_source.md').read_text(encoding='utf-8')
          clean = re.sub(r'`[^`]*`', '', t)
          clean = re.sub(r'<!--.*?-->', '', clean, flags=re.S)

          table_defs = sorted(set(re.findall(r'\*\*Table S(\d+)\*\*', t)), key=int)
          main_required = ['1','2','3','6','7','8','9','11','15','16']
          missing_main_refs = [x for x in main_required if x not in table_defs]

          p4 = t.find('Outcome-blind chemical-decision boundary case study')
          completion = t.find('# Current completion assessment')

          checks = {
              'word_count': len(re.findall(r"\b[A-Za-z0-9][A-Za-z0-9'\-]*\b", t)),
              'html_marker_count': len(re.findall(r'<!--', t)),
              'pre_registered_count': len(re.findall(r'pre-registered', clean, flags=re.I)),
              'reader_facing_protocol_count': len(re.findall(r'Protocol A(?:\.1)?|_A1', clean)),
              'reader_facing_stability_floor_count': len(re.findall(r'\bstability floor\b', clean, flags=re.I)),
              'p2_has_14986': '14,986' in t,
              'p2_has_5083': '50.83' in t,
              'p2_has_fresh_59': bool(re.search(r'59\s+fresh|fresh.*59', t, flags=re.I)),
              'p3a_has_24_of_24': '24/24' in t,
              'p3a_has_kappa_1000': '1.000' in t,
              'p3a_has_rho_0995': '0.995' in t,
              'p4_after_completion_assessment': p4 > completion >= 0,
              'defined_supplementary_tables': table_defs,
              'main_required_tables_missing_from_SI_plan': missing_main_refs,
          }

          priorities = []
          if missing_main_refs:
              priorities.append('Define the supplementary tables already cited by the revised main text (currently S15-S16 are missing from the SI table plan).')
          if checks['p4_after_completion_assessment']:
              priorities.append('Integrate the P4 boundary case into the numbered SI structure instead of leaving it appended after the completion assessment.')
          if not (checks['p2_has_14986'] and checks['p2_has_5083'] and checks['p2_has_fresh_59']):
              priorities.append('Add a dedicated P2 prospective-validation note with the fresh-perturbation design, denominators, risk separation and scope limits.')
          if not (checks['p3a_has_24_of_24'] and checks['p3a_has_kappa_1000'] and checks['p3a_has_rho_0995']):
              priorities.append('Expand the SI treatment of the resolved 24-system P3A implementation-transfer panel so it matches the current main-text evidence.')
          if checks['pre_registered_count']:
              priorities.append('Replace submission-facing pre-registered wording with pre-specified/frozen-before-execution wording unless an external registry exists.')
          if checks['reader_facing_protocol_count']:
              priorities.append('Remove reader-facing internal Protocol A/A.1 labels while preserving machine-readable filenames only as provenance.')
          if checks['reader_facing_stability_floor_count']:
              priorities.append('Use operational QSQ response scale in reader-facing prose; retain historical stability-floor labels only for frozen-file provenance.')
          if checks['html_marker_count']:
              priorities.append('Remove internal HTML integration markers from the submission-facing SI.')

          report = {
              'source_commit': '5eabc39476b3e9d3a1ddebd46169bc29aaca877c',
              'audit': checks,
              'priorities': priorities,
          }
          Path('SI_SYNC_AUDIT_PUBLIC.json').write_text(json.dumps(report, indent=2), encoding='utf-8')

          lines = ['# SI synchronization audit - 2026-09-16', '', f"- Source commit: `{report['source_commit']}`"]
          lines += [f"- {k}: **{v}**" for k,v in checks.items()]
          lines += ['', '## Priority fixes'] + [f"{i+1}. {x}" for i,x in enumerate(priorities)]
          Path('SI_SYNC_AUDIT_PUBLIC.md').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print(Path('SI_SYNC_AUDIT_PUBLIC.md').read_text())
          PY

      - name: Upload QA only
        uses: actions/upload-artifact@v4
        with:
          name: si-sync-audit-20260916
          path: |
            SI_SYNC_AUDIT_PUBLIC.md
            SI_SYNC_AUDIT_PUBLIC.json
          retention-days: 1
