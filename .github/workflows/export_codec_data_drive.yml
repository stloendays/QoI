name: Export codec benchmark data for Drive

on:
  push:
    branches: [ops/drive-data-export-20260916]
    paths:
      - .github/workflows/export_codec_data_drive.yml
      - drive_export_marker.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Stage codec benchmark payload
        run: |
          mkdir -p drive_export
          cp benchmark/master_benchmark_full.csv drive_export/
          cp benchmark/master_benchmark_base_ladder.csv drive_export/
          cp benchmark/master_benchmark_tight_ladder.csv drive_export/
          cp benchmark/summary_a1.csv drive_export/
          cp benchmark/pairwise_a1.csv drive_export/
          cp benchmark/best_certified_a1.csv drive_export/
          cp benchmark/lossless_baselines.jsonl drive_export/
          sha256sum drive_export/* > drive_export/SHA256SUMS.txt
          printf '%s\n' '${{ github.sha }}' > drive_export/SOURCE_COMMIT.txt
      - name: Upload raw files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rho-codec-drive-export-20260916
          path: drive_export/
          if-no-files-found: error
          compression-level: 0
