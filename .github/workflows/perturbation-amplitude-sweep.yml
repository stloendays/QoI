name: Perturbation amplitude sweep

on:
  push:
    branches: [analysis/perturbation-amplitude-sweep]
  workflow_dispatch:
    inputs:
      indices:
        description: 'JSON array of target indices, e.g. [0,1,2]. Empty = all.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      indices: ${{ steps.build.outputs.indices }}
    steps:
      - uses: actions/checkout@v4
      - id: build
        env:
          MSG: ${{ github.event.head_commit.message }}
          IN: ${{ github.event.inputs.indices }}
          TARGETS: ${{ secrets.AMPLITUDE_SWEEP_TARGETS }}
        run: |
          if [ -z "$TARGETS" ]; then
            echo "::error::repository secret AMPLITUDE_SWEEP_TARGETS is not set"
            exit 1
          fi
          printf '%s' "$TARGETS" > targets.jsonl
          n=$(grep -c . targets.jsonl)
          if [ -n "$IN" ]; then
            echo "indices=$IN" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$MSG" | grep -q '\[sweep-all\]'; then
            python -c "import json,sys; print('indices='+json.dumps(list(range(int(sys.argv[1])))))" "$n" >> "$GITHUB_OUTPUT"
          else
            # canary: one target, so a broken pipeline costs one job rather than $n
            echo 'indices=[0]' >> "$GITHUB_OUTPUT"
          fi
          echo "targets in manifest: $n"

  sweep:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        index: ${{ fromJson(needs.plan.outputs.indices) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==2.3.5" "numba==0.65.1" "baderkit==0.10.2"

      - name: Record environment
        run: |
          python - <<'PY'
          import numpy, numba, baderkit, platform, sys
          print("python  ", sys.version.split()[0])
          print("platform", platform.platform())
          print("numpy   ", numpy.__version__)
          print("numba   ", numba.__version__)
          print("baderkit", getattr(baderkit, "__version__", "0.10.2"))
          PY
          nproc && free -g | head -2

      - name: Materialise target list from secret
        env:
          TARGETS: ${{ secrets.AMPLITUDE_SWEEP_TARGETS }}
        run: printf '%s' "$TARGETS" > targets.jsonl

      - name: Sweep
        run: |
          python tools/amplitude_sweep.py \
            --targets targets.jsonl \
            --index ${{ matrix.index }} \
            --out "out/amplitude_sweep_${{ matrix.index }}.csv"

      - uses: actions/upload-artifact@v4
        with:
          name: amplitude-sweep-${{ matrix.index }}
          path: out/*.csv
          retention-days: 30
