name: Fourier-spectrum mechanism audit private handoff

on:
  workflow_dispatch:
  push:
    branches:
      - research/hartree-qsq-generality-20260927
    paths:
      - analysis/fourier_spectrum_mechanism/**
      - ci/hartree_qsq_handoff_public.pem
      - .github/workflows/fourier_spectrum_mechanism.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Install pinned codec and analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 pandas==2.3.3 zfpy==1.0.1 pysz==1.0.3 h5py==3.14.0 hdf5plugin==7.0.0

      - name: Download and verify frozen 12-material source cohort
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fourier_cache"
          python - <<'PY'
          import hashlib
          import pathlib
          import urllib.request
          import pandas as pd

          full = pd.read_csv('analysis/hartree_potential_pilot/full_ladder_rows.csv')
          mids = list(dict.fromkeys(full['material_id'].astype(str).tolist()))
          assert len(mids) == 12
          meta = pd.read_csv('materials_metadata.csv').set_index('material_id')
          cache = pathlib.Path(__import__('os').environ['RUNNER_TEMP']) / 'fourier_cache'
          for mid in mids:
              row = meta.loc[mid]
              path = cache / f'{mid}.json.gz'
              urllib.request.urlretrieve(str(row['url']), path)
              got = hashlib.sha256(path.read_bytes()).hexdigest()
              assert got == str(row['sha256'])
          print('SOURCE_PROVENANCE_PASS')
          PY

      - name: Execute Fourier-spectrum mechanism audit
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/fourier_private"
          rm -rf "$out"
          mkdir -p "$out"
          python analysis/fourier_spectrum_mechanism/run_fourier_spectrum_audit.py \
            --cache "$RUNNER_TEMP/fourier_cache" \
            --output "$out" \
            > "$RUNNER_TEMP/audit_stdout.txt" 2> "$RUNNER_TEMP/audit_stderr.txt" || {
              cat "$RUNNER_TEMP/audit_stderr.txt" >&2
              exit 1
            }
          grep -qx 'FOURIER_SPECTRUM_PIPELINE_PASS' "$RUNNER_TEMP/audit_stdout.txt"
          cat "$out/PUBLIC_QA.txt"
          python --version > "$out/python_version.txt" 2>&1
          python -m pip freeze | sort > "$out/pip_freeze.txt"
          git rev-parse HEAD > "$out/git_head.txt"

      - name: Encrypt private scientific outputs
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/fourier_private/PUBLIC_QA.txt" "$RUNNER_TEMP/PUBLIC_QA.txt"
          tar -C "$RUNNER_TEMP/fourier_private" -czf "$RUNNER_TEMP/fourier_spectrum_private.tgz" .
          openssl rand -hex 32 > "$RUNNER_TEMP/handoff.key"
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in "$RUNNER_TEMP/fourier_spectrum_private.tgz" \
            -out "$RUNNER_TEMP/fourier_spectrum_private.tgz.enc" \
            -pass file:"$RUNNER_TEMP/handoff.key"
          openssl pkeyutl -encrypt -pubin \
            -inkey ci/hartree_qsq_handoff_public.pem \
            -in "$RUNNER_TEMP/handoff.key" \
            -out "$RUNNER_TEMP/handoff.key.enc"
          rm -f "$RUNNER_TEMP/handoff.key" "$RUNNER_TEMP/fourier_spectrum_private.tgz"

      - uses: actions/upload-artifact@v4
        with:
          name: fourier-spectrum-mechanism-private
          path: |
            ${{ runner.temp }}/fourier_spectrum_private.tgz.enc
            ${{ runner.temp }}/handoff.key.enc
            ${{ runner.temp }}/PUBLIC_QA.txt
          if-no-files-found: error
          retention-days: 1
