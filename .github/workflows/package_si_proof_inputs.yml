name: Package supplementary-information proof inputs

on:
  workflow_dispatch:
  push:
    branches:
      - paper/fourier-mechanism-integration-20260927
    paths:
      - 'paper/SUPPLEMENTARY_INFORMATION.md'
      - 'paper/SUPPLEMENTARY_TABLE*.md'
      - 'figures/R/rendered/supplementary_figureS*_R.png'
      - '.github/workflows/package_si_proof_inputs.yml'

permissions:
  contents: read

concurrency:
  group: qoi-si-proof-package
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify SI proof inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s paper/SUPPLEMENTARY_INFORMATION.md
          for n in 1 2 3 4 5 6 7 8; do
            f=$(find figures/R/rendered -maxdepth 1 -type f -name "supplementary_figureS${n}_*_R.png" | head -n 1)
            test -n "$f" && test -s "$f" || { echo "Missing Supplementary Figure S$n PNG"; exit 1; }
          done
          for f in paper/SUPPLEMENTARY_TABLE*.md; do test -s "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: si-proof-inputs
          path: |
            paper/SUPPLEMENTARY_INFORMATION.md
            paper/SUPPLEMENTARY_TABLE*.md
            figures/R/rendered/supplementary_figureS1_*_R.png
            figures/R/rendered/supplementary_figureS2_*_R.png
            figures/R/rendered/supplementary_figureS3_*_R.png
            figures/R/rendered/supplementary_figureS4_*_R.png
            figures/R/rendered/supplementary_figureS5_*_R.png
            figures/R/rendered/supplementary_figureS6_*_R.png
            figures/R/rendered/supplementary_figureS7_*_R.png
            figures/R/rendered/supplementary_figureS8_*_R.png
          if-no-files-found: error
          retention-days: 7
