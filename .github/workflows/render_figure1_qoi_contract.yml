name: Render Figure 1 QoI contract

on:
  workflow_dispatch:
  push:
    paths:
      - 'figures/R/figure1_qoi_contract.R'
      - '.github/workflows/render_figure1_qoi_contract.yml'

permissions:
  contents: write

concurrency:
  group: qoi-formal-figure-writeback
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ggplot2
            any::svglite
      - name: Render Figure 1
        run: Rscript figures/R/figure1_qoi_contract.R
      - name: Validate Figure 1 outputs
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            figures/R/rendered/figure1_qoi_contract_R.png \
            figures/R/rendered/figure1_qoi_contract_R.pdf \
            figures/R/rendered/figure1_qoi_contract_R.svg; do
            test -s "$f" || { echo "Missing or empty output: $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: figure1-qoi-contract
          path: |
            figures/R/rendered/figure1_qoi_contract_R.png
            figures/R/rendered/figure1_qoi_contract_R.pdf
            figures/R/rendered/figure1_qoi_contract_R.svg
      - name: Commit rendered outputs
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cp figures/R/rendered/figure1_qoi_contract_R.{png,pdf,svg} "$tmp"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp "$tmp"/figure1_qoi_contract_R.* figures/R/rendered/
          git add figures/R/rendered/figure1_qoi_contract_R.{png,pdf,svg}
          if git diff --cached --quiet; then
            echo "Figure 1 outputs unchanged."
            exit 0
          fi
          git commit -m "figure: render Figure 1 formal outputs"
          git push origin HEAD:main
