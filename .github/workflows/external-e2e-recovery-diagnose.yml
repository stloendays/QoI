name: External E2E Recovery Diagnose

on:
  push:
    branches: [external-e2e-validation]
    paths:
      - 'validation/EXTERNAL_RECOVERY_TRIGGER'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download failed shard 2 artifact from formal run
        uses: actions/download-artifact@v4
        with:
          name: external-e2e-shard-2
          path: validation/recovery_run_34074537547/shard2
          github-token: ${{ github.token }}
          repository: stloendays/QoI
          run-id: 34074537547

      - name: Record exact failed-shard diagnostics
        run: |
          set -eu
          out=validation/EXTERNAL_RUN_34074537547_FAILURE_DIAGNOSIS.md
          {
            echo '# External E2E run 34074537547 failure diagnosis'
            echo
            echo 'This file is an execution diagnostic only. It does not alter Protocol A.1, codec settings, tolerance ladders, eligibility, early stopping, failure semantics, or the frozen 63-system confirmatory cohort.'
            echo
            echo '## Shard 2 material-level failures'
            echo '```csv'
            cat validation/recovery_run_34074537547/shard2/formal_external_e2e_failures.csv
            echo '```'
            echo
            echo '## Shard 2 row-level failures'
            echo '```csv'
            cat validation/recovery_run_34074537547/shard2/formal_external_e2e_row_failures.csv || true
            echo '```'
            echo
            echo '## Shard 2 summary'
            echo '```json'
            cat validation/recovery_run_34074537547/shard2/summary.json
            echo '```'
            echo
            echo '## Shard 2 material audit'
            echo '```csv'
            cat validation/recovery_run_34074537547/shard2/material_audit.csv
            echo '```'
          } > "$out"

      - name: Commit diagnostic record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/EXTERNAL_RUN_34074537547_FAILURE_DIAGNOSIS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record exact external E2E shard 2 failure diagnostics'
          git push
