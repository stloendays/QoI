name: Temporary privacy cleanup

on:
  push:
    branches: [privacy/public-placeholder-20260916]
    paths:
      - .github/workflows/temp_privacy_cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacy/public-placeholder-20260916
          fetch-depth: 2
      - name: Remove unpublished research assets from current branch
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name README.md \
            ! -name .github \
            -exec rm -rf {} +
          rm -rf .github/workflows
          cat > README.md <<'EOF'
          # QoI / RhoCodec

          This repository is an intentionally minimal public placeholder for an active, unpublished research project.

          The manuscript, benchmark datasets, figures, supplementary information, validation outputs, analysis records, experimental protocols, and submission materials are **not distributed publicly before publication**.

          Public GitHub content must not be treated as the authoritative source for unpublished scientific results or submission text. Authorized collaborators and Agents should use the project's private research workspace and internal project status records.

          Do not restore unpublished research assets, numerical result tables, manuscript drafts, or submission figures to the public repository until an explicit release decision has been made.
          EOF
          cat > .gitignore <<'EOF'
          # Unpublished research assets: keep private until explicit release.
          paper/
          benchmark/
          stability/
          figures/
          supplement/
          validation/
          analysis/
          mechanism/
          protocol/
          data/
          RESULTS.md
          external_test_MANIFEST.json
          failure_registry.csv
          materials_metadata.csv
          *.docx
          *.pdf
          *submission*.zip
          EOF
      - name: Commit current-branch privacy cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'privacy: remove unpublished research assets from public branch'
          git push origin HEAD:privacy/public-placeholder-20260916
