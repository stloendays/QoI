name: Private SI revision QA

on:
  push:
    branches: [review/si-sync-audit-20260916]
    paths:
      - 'scripts/si_revision_private.py'
      - '.github/workflows/si_revision_private.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_COMMIT: 5eabc39476b3e9d3a1ddebd46169bc29aaca877c
  SI_PATH: paper/SUPPLEMENTARY_INFORMATION_DRAFT_20260911.md
  EXPECTED_SHA256: f42eb6e5b4d6d804e0d047682e001f66edfaa392a9aba94245945aefaf2b3289

jobs:
  revise-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover frozen SI and apply deterministic synchronization
        shell: bash
        run: |
          set -euo pipefail
          git show "${SOURCE_COMMIT}:${SI_PATH}" > si_source.md
          python scripts/si_revision_private.py si_source.md si_revised.md
          sha256sum si_revised.md | awk '{print $1}' > SI_REVISION_SHA256.txt
          test "$(cat SI_REVISION_SHA256.txt)" = "$EXPECTED_SHA256"
          printf '%s\n' "$SOURCE_COMMIT" > SOURCE_COMMIT.txt

      - name: Guard evidence, terminology and cross-reference structure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          t=Path('si_revised.md').read_text(encoding='utf-8')
          clean=re.sub(r'`[^`]*`','',t)

          required=[
            '1,332/1,332 successful reconstructions','20.34-fold','14,986/14,986',
            '135/8,437 eligible trials','5,326/6,549 screen-rejected trials','50.83-fold',
            '537.69-fold','24/24 systems',"$\\kappa=1.000$",'$\\rho=0.995$','$\\rho=0.754$',
            'all 60 direct qualitative target-atom charge-transfer directions','36/60 trials',
            '48 Henkelman calls / 397.2 s','108 calls / 733.3 s'
          ]
          for x in required: assert x in t, x

          forbidden=['pre-registered','<!--','Current completion assessment','# Proposed Supplementary Tables','# Proposed Supplementary Figures']
          for x in forbidden: assert x not in t, x
          assert not re.search(r'(?<!`)Protocol A(?:\.1)?(?!`)', clean)
          assert not re.search(r'\bstability floor\b', clean, flags=re.I)

          notes=re.findall(r'(?m)^## Supplementary Note (\d+) —',t)
          assert notes == [str(i) for i in range(1,13)], notes
          tables=sorted({int(x) for x in re.findall(r'\*\*Table S(\d+)\*\*',t)})
          assert tables == list(range(1,17)), tables
          assert t.index('Supplementary Note 3 — Prospective validation') < t.index('Supplementary Note 6 — Equal-search control') < t.index('Supplementary Note 7 — Extended Bader mechanism') < t.index('Supplementary Note 12 — Outcome-blind') < t.index('# Supplementary table inventory')

          qa=f'''# Private SI revision QA — 2026-09-16\n\n- Source commit: `{Path('SOURCE_COMMIT.txt').read_text().strip()}`\n- Revised SHA-256: `{Path('SI_REVISION_SHA256.txt').read_text().strip()}`\n- Numbered Supplementary Notes: **12 / PASS**\n- Supplementary table inventory: **S1–S16 / PASS**\n- P1 equal-search anchors: **PASS**\n- P2 prospective anchors and canonical 537.69-fold secondary RR: **PASS**\n- P3A 24-system implementation-transfer anchors: **PASS**\n- P4 endpoint-boundary and audit-cost anchors: **PASS**\n- pre-registered wording: **0**\n- internal HTML markers: **0**\n- internal completion-assessment block: **0**\n- reader-facing historical Protocol labels: **0**\n- reader-facing stability-floor wording: **0**\n- Frozen scientific data/thresholds/cohorts/endpoints: **not modified**\n'''
          Path('SI_REVISION_QA_PUBLIC.md').write_text(qa,encoding='utf-8')
          print(qa)
          PY

      - name: Upload QA only
        uses: actions/upload-artifact@v4
        with:
          name: si-private-revision-qa-20260916
          path: |
            SI_REVISION_QA_PUBLIC.md
            SI_REVISION_SHA256.txt
            SOURCE_COMMIT.txt
          retention-days: 1
