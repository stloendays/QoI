name: External E2E Server Final 4

on:
  workflow_dispatch:

jobs:
  recover-material:
    strategy:
      fail-fast: false
      matrix:
        include:
          - idx: 3
            material: aflow-Cl1O12Pb5V3_ICSD_203074
          - idx: 9
            material: aflow-B1C1F6K1_ICSD_1194
          - idx: 10
            material: aflow-B6H2O13Sr3_ICSD_262541
          - idx: 16
            material: aflow-Mo3Na1O16P3_ICSD_66877
    runs-on: self-hosted
    timeout-minutes: 1440
    steps:
      - name: Checkout frozen scientific implementation
        uses: actions/checkout@v4
        with:
          ref: 893f931b3045b0b628329db81999c2f439d4e830
      - name: Run actions/setup-python@v5
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install pinned external E2E environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r validation/requirements-external-e2e.txt
      - name: Re-run one frozen-corpus material without semantic changes
        run: |
          python validation/formal_external_e2e.py \
            --material-id '${{ matrix.material }}' \
            --codecs zfp,sz3,sperr \
            --output-dir 'validation/recovery_${{ matrix.idx }}'
      - name: Archive recovery environment
        if: always()
        run: |
          mkdir -p 'validation/recovery_${{ matrix.idx }}'
          python --version > 'validation/recovery_${{ matrix.idx }}/python_version.txt'
          python -m pip freeze | sort > 'validation/recovery_${{ matrix.idx }}/pip_freeze.txt'
          sha256sum validation/requirements-external-e2e.txt > 'validation/recovery_${{ matrix.idx }}/requirements_sha256.txt'
          git rev-parse HEAD > 'validation/recovery_${{ matrix.idx }}/git_commit.txt'
          printf '%s\n' '${{ matrix.material }}' > 'validation/recovery_${{ matrix.idx }}/requested_material.txt'
      - name: Upload recovered material output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-e2e-server-recovery-${{ matrix.idx }}
          path: validation/recovery_${{ matrix.idx }}
          if-no-files-found: error
