name: Temporary fix Drive data map in README

on:
  push:
    branches: [docs/drive-data-map-20260916]
    paths:
      - .github/workflows/temp_fix_drive_readme.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/drive-data-map-20260916
          fetch-depth: 2
      - name: Replace storage section safely
        env:
          SECTION_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p=Path('README.md')
          t=p.read_text()
          start=t.index('## Data storage and Agent map')
          end=t.index('## Central question', start)
          section=base64.b64decode(os.environ['SECTION_B64']).decode()
          p.write_text(t[:start]+section+t[end:])
          PY
          rm .github/workflows/temp_fix_drive_readme.yml
      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/temp_fix_drive_readme.yml
          git commit -m 'docs: preserve code literals in Drive data map'
          git push origin HEAD:docs/drive-data-map-20260916
