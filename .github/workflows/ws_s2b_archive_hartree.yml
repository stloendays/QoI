name: WS-S2b whole-object Hartree archive with decoded-frame moments

# Descriptive archive run (scope expansion PLAN.md WS-S): the magnetization block of every object of the
# frozen 300-object archive sample, stored under the per-atom moment contract of WS-S1.
on:
  workflow_dispatch:
  push:
    branches:
      - research/scope-expansion-20261022
    paths:
      - analysis/scope_expansion_20261022/RUN_S2B

permissions:
  contents: write

concurrency:
  group: ws-s2b-archive-hartree-20261022
  cancel-in-progress: false

env:
  MANIFEST: analysis/scope_expansion_20261022/archive_hartree_objects.csv
  NSHARDS: '20'
  FROZEN_COMMIT: 893f931b3045b0b628329db81999c2f439d4e830
  LAW_REF: paper/nc-rev5-deployment-cost-20261012
  RESULTS: analysis/scope_expansion_20261022/results/s2b_archive_hartree_decframe

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      indices: ${{ steps.idx.outputs.indices }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - id: idx
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.4.6
          python -m py_compile repo/analysis/scope_expansion_20261022/run_spin_s1.py repo/analysis/scope_expansion_20261022/run_spin_s2_archive.py repo/analysis/scope_expansion_20261022/run_spin_s2b_archive_hartree.py
          n=$(python -c "import csv; print(len(list(csv.DictReader(open('repo/$MANIFEST')))))")
          test "$n" -gt 0
          test "$n" -eq 300
          echo "indices=$(python -c "import json; print(json.dumps(list(range($NSHARDS))))")" >> "$GITHUB_OUTPUT"

  material:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        index: ${{ fromJSON(needs.preflight.outputs.indices) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_COMMIT }}
          path: frozen
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LAW_REF }}
          path: lawrepo
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: frozen/validation/requirements-external-e2e.txt
      - name: Install scientific stack and Fortran compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran
          python -m pip install --upgrade pip
          python -m pip install -r frozen/validation/requirements-external-e2e.txt
      - name: Build Henkelman Bader
        shell: bash
        run: |
          set -euo pipefail
          cp -r repo/mechanism/independent_bader_20260908/reference_source "$RUNNER_TEMP/bader_source"
          cd "$RUNNER_TEMP/bader_source"
          sed -i 's/^LINK = -static/LINK =/' makefile.osx_gfortran
          make -f makefile.osx_gfortran
          test -x bader
      - name: Run material
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ws_s2b_${{ matrix.index }}"
          python repo/analysis/scope_expansion_20261022/run_spin_s2b_archive_hartree.py run --law-root lawrepo \
            --objects "repo/$MANIFEST" --shard ${{ matrix.index }} --nshards "$NSHARDS" --frozen-root frozen \
            --bader "$RUNNER_TEMP/bader_source/bader" --out "$out"
          git -C repo rev-parse HEAD > "$out/research_branch_commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ws-s2b-shard-${{ matrix.index }}
          path: ${{ runner.temp }}/ws_s2b_${{ matrix.index }}
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    if: always() && needs.preflight.result == 'success'
    needs: [preflight, material]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install numpy==2.3.5 pandas==2.3.3
      - uses: actions/download-artifact@v4
        with:
          pattern: ws-s2b-shard-*
          path: materials
      - name: Aggregate
        shell: bash
        run: |
          set -euo pipefail
          out="repo/$RESULTS"
          rm -rf "$out"
          mkdir -p "$out/materials" materials
          python repo/analysis/scope_expansion_20261022/run_spin_s2b_archive_hartree.py aggregate --inputs materials \
            --hartree repo/analysis/scope_expansion_20261022/archive_hartree_objects.csv --out "$out"
          find materials \( -name "*.json" -o -name "*_rows.csv" \) | while read -r f; do cp "$f" "$out/materials/"; done
          git -C repo rev-parse HEAD > "$out/research_branch_commit_before_results.txt"
          echo "$FROZEN_COMMIT" > "$out/frozen_scientific_commit.txt"
      - name: Commit results
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULTS"
          if git diff --cached --quiet; then echo 'No result changes.'; else
            git commit -m "research: WS-S2b Hartree decoded-frame archive results"
            git pull --rebase origin research/scope-expansion-20261022
            git push origin HEAD:research/scope-expansion-20261022
          fi
