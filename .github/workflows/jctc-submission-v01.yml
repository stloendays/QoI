name: JCTC submission v0.1

on:
  push:
    branches:
      - submission/jctc-v0.1
    paths:
      - 'submission/RUN_JCTC_SUBMISSION_V01.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: submission/jctc-v0.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build JCTC manuscript
        run: python analysis/build_jctc_submission_v01.py | tee submission/jctc_build_stdout.txt
      - name: Lint JCTC manuscript
        run: python analysis/lint_jctc_submission_v01.py | tee submission/jctc_lint_stdout.txt
      - name: Commit generated submission manuscript
        run: |
          git config user.name 'chatgpt-analysis-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add submission/JCTC_MANUSCRIPT_v0.1.md submission/JCTC_MANUSCRIPT_LINT_v0.1.md submission/jctc_build_stdout.txt submission/jctc_lint_stdout.txt
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Build and lint JCTC submission manuscript v0.1'
            git pull --rebase origin submission/jctc-v0.1
            git push origin HEAD:submission/jctc-v0.1
          fi
