workflow_spec_version: 1
name: QoI-qualified scientific data approximation workflow
status: draft-framework
case_study:
  scientific_field: electronic_charge_density
  downstream_qoi: atom_resolved_Bader_charge
  qoi_unit: electron

principle:
  statement: >-
    Approximation quality is certified against a downstream scientific quantity
    only after that quantity is shown to be numerically stable at the requested
    scientific tolerance.

stages:
  - id: provenance_gate
    purpose: verify source identity and parser provenance
    required_checks:
      - source_sha256
      - source_byte_count
      - grid_shape_against_manifest
      - parser_provenance
      - finite_source_values
    failure_verdict: PIPELINE_FAILURE
    failure_granularity: material

  - id: input_quality_diagnostics
    purpose: record source-field conditions without attributing them to the codec
    diagnostics:
      - source_density_min
      - source_density_max
      - source_has_negative_density
      - bader_solver_warnings
    effect_on_codec_verdict: none_by_default

  - id: intrinsic_qoi_stability
    protocol: Protocol_A1
    perturbation:
      distribution: uniform
      amplitude: material_float32_roundtrip_Linf
      seeds: [20260905, 1, 2, 3, 4]
      aggregation: max_over_seeds_and_atoms
    bader:
      implementation: baderkit
      method: ongrid
      basins_rederived: true
    thresholds_e: [0.0001, 0.001, 0.01]

  - id: eligibility
    rule: stability_floor_A1_e < tau_e
    ineligible_verdict: NON_EVALUABLE_BADER_UNSTABLE
    semantics: neither_pass_nor_fail

  - id: algorithm_perturbation
    codecs:
      ZFP:
        mode: fixed_accuracy
      SZ3:
        mode: ABS_INTERP_LORENZO
      SPERR:
        mode: absolute_single_chunk
    required_audits:
      - nominal_tolerance_relative
      - nominal_tolerance_absolute
      - realized_Linf
      - realized_Linf_over_nominal
      - bound_respected
      - compression_ratio
      - bits_per_value

  - id: qoi_re_evaluation
    diagnostics:
      fixed_basin:
        description: integrate reconstructed field over original atom domains
        metric: Bader_error_fixed_e
        role: mechanism_diagnostic_not_headline_contract
      resolved_basin:
        description: recompute Bader basins from reconstructed field
        metric: Bader_error_resolved_e
        role: certification_contract
    topology_diagnostics:
      - atom_domain_migration_fraction
      - vacuum_mask_change_fraction
      - bader_maxima_count_changed

  - id: certification
    rule: eligible_A1_at_tau AND Bader_error_resolved_e < tau_e
    verdicts:
      - CERTIFIED
      - NOT_CERTIFIED
      - NON_EVALUABLE_BADER_UNSTABLE
      - PIPELINE_FAILURE

  - id: failure_accounting
    material_level:
      examples:
        - provenance_failure
        - parser_failure
        - original_grid_audit_failure
        - original_bader_failure
      effect: hard_validation_failure
      registry: formal_external_e2e_failures.csv
    row_level:
      unit: material_x_codec_x_tolerance
      examples:
        - codec_failure
        - reconstructed_grid_audit_failure
        - bader_solver_failure
        - topology_diagnostic_failure
      effect: >-
        failed row is not a pass and is not present in the successful rate-fidelity
        table; successful rows for the same material remain valid
      hard_fail_shard: false
      registry: formal_external_e2e_row_failures.csv
      schema_compatible_with: failure_registry.csv

  - id: rate_fidelity
    primary_metric:
      name: Certified_Compression_Ratio
      abbreviation: CCR
      relationship_to_release: formal_name_for_existing_best_certified_ratio
      definition: >-
        For material i, codec c and scientific tolerance tau, CCR is the maximum
        compression_ratio among retained codec settings certified at tau.
    inferential_unit: material
    summary:
      - certification_fraction_among_admitted_materials
      - median_CCR
      - deterministic_bootstrap_95pct_CI
      - CCR_quantiles
    paired_comparison:
      unit: material
      no_CCR_semantics:
        one_codec_has_CCR: codec_with_CCR_wins
        neither_codec_has_CCR: tie
      effect_size: median_log2_CCR_ratio_where_both_CCR_exist

frozen_sampling_policy:
  development_reference_table: benchmark/master_benchmark_full.csv
  base_ladder:
    applies_to: all_materials
    lower_relative_boundary: 1.0e-5
    direction: tight_to_loose
    early_stop:
      metric: Bader_error_resolved_e
      threshold_e: 0.05
      retain_boundary_row: true
      failed_row_triggers_stop: false
  tight_ladder:
    relative_tolerance_lt: 1.0e-5
    applies_if: stability_floor_A1_e < 0.001
  external_policy:
    tuning_after_manifest_freeze: forbidden
    tolerance_values_source: frozen_development_master_table
    material_failures: retained_as_PIPELINE_FAILURE
    row_failures: retained_and_not_counted_as_passes

external_validation:
  corpus_manifest: external_test_MANIFEST.json
  analysis_plan: protocol/EXTERNAL_RATE_FIDELITY_ANALYSIS_PLAN.md
  rate_fidelity_split: validation/external_rate_fidelity_split.json
  descriptive_full_corpus:
    n: 65
    strata:
      AFLOW_bulk: 37
      NOMAD_2D: 28
    eligible_A1_counts:
      0.0001: 18
      0.001: 44
      0.01: 59
    role: full_row_release_and_descriptive_rate_fidelity_summary
  implementation_sentinels:
    n: 2
    material_ids:
      - aflow-Ni1_ICSD_181716
      - nomad2d-0XHkHlmw3DQ_
    reason: rate_fidelity_outputs_inspected_during_harness_validation
  primary_confirmatory_cohort:
    n: 63
    strata:
      AFLOW_bulk: 36
      NOMAD_2D: 27
    eligible_A1_counts:
      0.0001: 16
      0.001: 42
      0.01: 57
    definition: frozen_65_minus_two_implementation_sentinels
    selection_after_outcome_inspection: forbidden
  frozen_preflight_invariants:
    development_master_rows: 6343
    development_base_rows: 4627
    development_tight_rows: 1716
    development_materials: 254
    development_tight_materials: 143
  execution:
    preflight:
      role: frozen_input_sampling_and_confirmatory_split_integrity_check
    smoke:
      role: regression_parser_and_protocol_closure
    frozen_pilot:
      role: full_ladder_two_sentinel_implementation_check
    full:
      role: run_all_65_then_build_primary_confirmatory_63_summary
      sharding: 8
  all65_output_dir: formal_external_all65
  confirmatory63_output_dir: formal_external_confirmatory63
  aggregate_outputs_per_analysis_set:
    - formal_external_e2e_rows.csv
    - material_audit.csv
    - formal_external_e2e_failures.csv
    - formal_external_e2e_row_failures.csv
    - best_certified_external.csv
    - external_summary_a1.csv
    - pairwise_external.csv
    - external_codec_summary.csv
    - summary.json

reproducibility_record:
  hashes_required:
    - external_manifest_sha256
    - stability_floor_sha256
    - protocol_A1_sha256
    - master_benchmark_sha256
    - rate_fidelity_split_sha256
  software_versions_required:
    - python
    - numpy
    - baderkit
    - pysz
    - zfpy
    - hdf5plugin
    - h5py

claim_guardrails:
  permitted_before_full_external_success:
    - empirically_stress_tested_workflow
    - externally_validated_stability_qualification
  permitted_after_confirmatory_external_success:
    - end_to_end_rate_fidelity_evaluation_on_prespecified_63_system_confirmatory_cohort
    - complete_65_system_external_row_release_with_two_implementation_sentinels_flagged
  prohibited_wording:
    - all_65_were_untouched_rate_fidelity_confirmation_data
    - universal_standard
    - universally_validated_workflow
